<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-dark: #0c0c0d;
  --bg-sheet: #0d0d0e;
  --bg-input: rgba(0, 0, 0, 0.28);
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;
  --accent: #6EE3A4;
  --accent-glow: rgba(110, 227, 164, 0.35);
  --eagle: #7DD3FC;
  --birdie: #6EE3A4;
  --par: #B8B6B0;
  --bogey: #FBBF24;
  --double: #F97066;
  --triple: #C4366B;
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #EDEEE9;
  --bg-card: #FFFFFF;
  --bg-dark: #0c0c0d;
  --bg-sheet: #FFFFFF;
  --bg-input: rgba(28,30,27,0.045);
  --border: rgba(28,30,27,0.08);
  --border-strong: rgba(28,30,27,0.14);
  --text-primary: #1C1E1B;
  --text-secondary: #63675F;
  --text-tertiary: #9A9E93;
  --text-quaternary: #C3C6BD;
  --accent: #2F9C6A;
  --accent-glow: rgba(47,156,106,0.25);
  --eagle: #2E8FC0;
  --birdie: #2F9C6A;
  --par: #6B6F66;
  --bogey: #B8860E;
  --double: #C0473A;
  --triple: #A03368;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-secondary); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 90px; padding-top: max(20px, env(safe-area-inset-top, 20px)); }

.hdr-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); margin: 0 0 14px; }

/* ===== Global 9/18 toggle ===== */
.hole-toggle { display: flex; gap: 6px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
.hole-toggle button { flex: 1; border: none; background: none; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 9px 0; border-radius: 9px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hole-toggle button.active { background: var(--accent); color: #04140f; }
[data-theme="light"] .hole-toggle button.active { color: #fff; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; position: relative; }
.card-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 10px; }

/* ===== Handicap ===== */
.hcp-num-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.hcp-num { font-size: 42px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; }
.hcp-tier { font-size: 12px; font-family: var(--font-mono); background: var(--bg-input); color: var(--text-secondary); padding: 4px 10px; border-radius: 999px; }
.hcp-note { font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; }
.hcp-range { display: flex; gap: 6px; margin-bottom: 12px; }
.hcp-range button { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-tertiary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hcp-range button.active { background: var(--accent); border-color: var(--accent); color: #04140f; }
[data-theme="light"] .hcp-range button.active { color: #fff; }
.hcp-chart-svg { width: 100%; height: 90px; display: block; overflow: visible; }

/* ===== Stat tiles ===== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.stat-tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 10px; text-align: center; }
.stat-tile-val { font-size: 19px; font-weight: 800; color: var(--text-primary); }
.stat-tile-label { font-size: 10px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-top: 3px; }
.stat-tile.best {
  background: linear-gradient(160deg, rgba(110,227,164,0.16), rgba(110,227,164,0.03));
  border-color: rgba(110,227,164,0.4);
  box-shadow: 0 0 22px rgba(110,227,164,0.18);
}
.stat-tile.best .stat-tile-val { color: var(--accent); text-shadow: 0 0 14px rgba(110,227,164,0.55); }

/* ===== Pie chart ===== */
.pie-wrap { display: flex; align-items: center; gap: 20px; }
.pie-svg-box { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
.pie-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pie-svg path { cursor: pointer; transition: opacity 0.15s; }
.pie-legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.pie-leg-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.pie-leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pie-leg-name { color: var(--text-secondary); flex: 1; }
.pie-leg-val { font-family: var(--font-mono); font-weight: 700; color: var(--text-primary); }

/* ===== Pie hover callout — leader line from the slice out to a
   floating name label, same idea across the main Hole Outcomes pie
   and the course-detail one. ===== */
.pie-leader-line { pointer-events: none; }
.pie-leader-dot { pointer-events: none; }
.pie-callout {
  position: absolute; transform: translate(-50%, -50%); pointer-events: none;
  background: var(--bg-sheet); border: 1.5px solid; border-radius: 999px;
  padding: 4px 10px; font-size: 11px; font-weight: 800; white-space: nowrap;
  display: none; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.pie-callout b { font-weight: 800; }
.pie-callout .pie-callout-n { opacity: 0.65; font-weight: 600; margin-left: 3px; }

/* ===== Putting ===== */
.putt-layout { display: flex; gap: 14px; }
.putt-side-tile { flex: 0 0 76px; background: var(--bg-input); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px; text-align: center; }
.putt-side-val { font-size: 22px; font-weight: 800; color: var(--text-primary); }
.putt-side-label { font-size: 9px; font-family: var(--font-mono); color: var(--text-tertiary); margin-top: 4px; line-height: 1.4; text-transform: uppercase; }
.putt-main { flex: 1; min-width: 0; }
.putt-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.putt-tabs button { flex: 1; font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 7px 0; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-tertiary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.putt-tabs button.active { background: var(--eagle); border-color: var(--eagle); color: #04202e; }
[data-theme="light"] .putt-tabs button.active { color: #fff; }
.putt-chart-svg { width: 100%; height: 90px; display: block; overflow: visible; }
.putt-pct-row { text-align: center; margin-top: 6px; }
.putt-pct { font-size: 22px; font-weight: 800; color: var(--text-primary); }
.putt-pct-label { font-size: 11px; color: var(--text-tertiary); margin-left: 5px; }
.putt-note { font-size: 11px; color: var(--text-tertiary); margin-top: 10px; text-align: center; }

/* ===== Course list (placeholder) ===== */
.course-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.course-fav-toggle { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-tertiary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.course-fav-toggle.active { background: rgba(251,191,36,0.16); border-color: rgba(251,191,36,0.4); color: #FBBF24; }

.course-card {
  position: relative; border-radius: 14px; overflow: hidden; background: var(--bg-dark);
  height: 120px; cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.course-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.course-card-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-quaternary); background: var(--bg-input); flex-direction: column; gap: 4px; }
.course-card-noimg span { font-size: 10px; font-family: var(--font-mono); }
.course-card-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent 60%); }
.course-card-body { position: absolute; left: 10px; right: 10px; bottom: 8px; }
.course-card-name { font-size: 12.5px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
.course-card-sub { font-size: 10.5px; color: rgba(255,255,255,0.75); margin-top: 1px; }
.course-carousel-mobile .course-card-name { font-size: 15.5px; }
.course-carousel-mobile .course-card-sub { font-size: 12px; }
.course-card-star { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.55); font-size: 14px; z-index: 2; }
.course-card-star.active { color: #FBBF24; }
.course-card-upload { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.75); z-index: 2; }
.course-card-upload input { display: none; }

.course-carousel-mobile { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.course-carousel-mobile::-webkit-scrollbar { display: none; }
.course-carousel-mobile .course-card { width: 66%; height: 190px; }
.course-grid-desktop { display: none; }
.view-more-courses-btn { grid-column: 1/-1; margin-top: 4px; padding: 10px; border-radius: 12px; border: 1px dashed var(--border-strong); background: none; color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; font-weight: 700; cursor: pointer; }
@media (min-width: 640px) {
  .course-carousel-mobile { display: none; }
  .course-grid-desktop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
}
.course-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 110; display: flex; align-items: center; justify-content: center; padding: 20px; }
.course-modal-overlay[hidden] { display: none; }
.course-modal { background: var(--bg-sheet); border: 1px solid var(--border-strong); border-radius: 18px; padding: 18px; max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto; }
.course-modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.course-modal-title { font-size: 16px; font-weight: 800; color: var(--text-primary); }
.course-modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 480px) { .course-modal-grid { grid-template-columns: repeat(3, 1fr); } }

/* ===== Rounds list ===== */
.filter-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip { flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-tertiary); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: #04140f; }
[data-theme="light"] .filter-chip.active { color: #fff; }

.round-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.round-row:active { background: rgba(255,255,255,0.04); }
[data-theme="light"] .round-row:active { background: rgba(28,30,27,0.04); }
.round-row + .round-row { border-top: 1px solid var(--border); }
.round-score-box { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text-primary); flex-shrink: 0; }
.round-body { flex: 1; min-width: 0; }
.round-course { font-size: 14px; font-weight: 700; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.round-meta { font-size: 11.5px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 2px; }
.round-diff { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
.view-more-btn { width: 100%; margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px dashed var(--border-strong); background: none; color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }

/* ===== Round detail modal ===== */
.rd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px; }
.rd-overlay[hidden] { display: none; }
.rd-sheet { background: var(--bg-sheet); border: 1px solid var(--border-strong); border-radius: 24px; width: 100%; max-width: 640px; margin: 0 auto; padding: 24px; max-height: 88vh; overflow-y: auto; }
.rd-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.rd-title { font-size: 20px; font-weight: 800; color: var(--text-primary); }
.rd-sub { font-size: 12.5px; color: var(--text-tertiary); margin-top: 3px; }
.rd-close { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-input); border: none; color: var(--text-secondary); font-size: 17px; cursor: pointer; flex-shrink: 0; }
.rd-score-row { display: flex; gap: 12px; margin: 18px 0; }
.rd-score-tile { flex: 1; background: var(--bg-input); border-radius: 14px; padding: 14px 8px; text-align: center; }
.rd-score-tile.hue-blue { background: linear-gradient(160deg, rgba(125,211,252,0.18), rgba(125,211,252,0.03)); box-shadow: 0 0 18px rgba(125,211,252,0.12); }
.rd-score-tile.hue-blue .rd-score-big { color: var(--eagle); text-shadow: 0 0 14px rgba(125,211,252,0.4); }
.rd-score-tile.hue-green { background: linear-gradient(160deg, rgba(110,227,164,0.18), rgba(110,227,164,0.03)); box-shadow: 0 0 18px rgba(110,227,164,0.12); }
.rd-score-tile.hue-green .rd-score-big { color: var(--accent); text-shadow: 0 0 14px rgba(110,227,164,0.4); }
.rd-score-tile.hue-gold { background: linear-gradient(160deg, rgba(251,191,36,0.18), rgba(251,191,36,0.03)); box-shadow: 0 0 18px rgba(251,191,36,0.12); }
.rd-score-tile.hue-gold .rd-score-big { color: var(--bogey); text-shadow: 0 0 14px rgba(251,191,36,0.4); }
.rd-score-big { font-size: 30px; font-weight: 800; color: var(--text-primary); line-height: 1; }
.rd-score-sub { font-size: 10.5px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.gir-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--birdie); box-shadow: 0 0 7px rgba(110,227,164,0.65); }
.rd-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; border: 1px solid var(--border); }
.rd-table { border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; width: 100%; }
.rd-table th, .rd-table td { padding: 9px 9px; text-align: center; white-space: nowrap; }
.rd-table th { color: var(--text-tertiary); font-weight: 600; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.rd-table td:first-child, .rd-table th:first-child { text-align: left; color: var(--text-secondary); }
.rd-cell-score { border-radius: 8px; font-weight: 800; display: inline-block; min-width: 26px; padding: 4px 0; }
.rd-cell-eagle { background: var(--eagle); color: #04202e; }
.rd-cell-birdie { background: var(--birdie); color: #04140f; }
.rd-cell-par { background: rgba(255,255,255,0.09); color: var(--text-primary); }
.rd-cell-bogey { background: var(--bogey); color: #2b1c02; }
.rd-cell-double { background: var(--double); color: #2b0805; }
[data-theme="light"] .rd-cell-eagle, [data-theme="light"] .rd-cell-birdie, [data-theme="light"] .rd-cell-bogey, [data-theme="light"] .rd-cell-double { color: #fff; }
[data-theme="light"] .rd-cell-par { background: rgba(28,30,27,0.06); }
.rd-cell-triple { background: var(--triple); color: #fff; }
.rd-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; font-size: 11px; color: var(--text-tertiary); }
.rd-legend span { display: inline-flex; align-items: center; gap: 5px; }
.rd-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.rd-no-holes { padding: 20px; text-align: center; color: var(--text-tertiary); font-size: 13px; background: var(--bg-input); border-radius: 12px; }

/* ===== Course detail modal ===== */
.cd-sheet { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.cd-hero { position: relative; height: 280px; flex-shrink: 0; background: var(--bg-input); }
.cd-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cd-hero-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-quaternary); flex-direction: column; gap: 6px; font-family: var(--font-mono); font-size: 11px; }
.cd-hero-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.05) 55%); }
.cd-hero-close, .cd-hero-upload { position: absolute; top: 14px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); border: none; color: #fff; font-size: 17px; cursor: pointer; z-index: 2; display: flex; align-items: center; justify-content: center; }
.cd-hero-close { right: 14px; }
.cd-hero-upload { left: 14px; color: rgba(255,255,255,0.9); }
.cd-hero-upload input { display: none; }
.cd-hero-body { position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 1; }
.cd-hero-name { font-size: 21px; font-weight: 800; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.cd-hero-sub { font-size: 12.5px; color: rgba(255,255,255,0.82); margin-top: 3px; }
.cd-content { padding: 22px 24px 28px; overflow-y: auto; flex: 1; min-height: 0; }
.cd-facts-row { display: flex; margin-bottom: 22px; background: var(--bg-input); border-radius: 14px; padding: 14px 0; }
.cd-fact { flex: 1; text-align: center; }
.cd-fact + .cd-fact { border-left: 1px solid var(--border-strong); }
.cd-fact-val { font-size: 17px; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono); }
.cd-fact-label { font-size: 9.5px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-top: 4px; }
.cd-section-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 12px; }
.cd-avg-num { font-size: 34px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1; }
.cd-avg-note { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; margin-bottom: 12px; }
.cd-avg-chart-svg { width: 100%; height: 76px; display: block; overflow: visible; margin-bottom: 24px; }
.cd-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 24px; }
.cd-stat-tile { background: var(--bg-input); border-radius: 16px; padding: 14px 6px; text-align: center; }
.cd-stat-tile-val { font-size: 18px; font-weight: 800; color: var(--text-primary); line-height: 1; }
.cd-stat-tile-label { font-size: 10.5px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-top: 8px; }
.cd-breakdown-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); margin: 24px 0 12px; padding-top: 22px; border-top: 1px solid var(--border); }
.cd-outcome-table { display: flex; flex-direction: column; }
.cd-outcome-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.cd-outcome-row + .cd-outcome-row { border-top: 1px solid var(--border); }
.cd-outcome-icon { width: 15px; height: 15px; flex-shrink: 0; }
.cd-outcome-name { flex: 1; font-size: 13px; color: var(--text-secondary); }
.cd-outcome-count { font-family: var(--font-mono); font-weight: 800; color: var(--text-primary); font-size: 13px; }
.cd-outcome-pct { font-family: var(--font-mono); color: var(--text-tertiary); font-size: 11px; margin-left: 6px; min-width: 34px; text-align: right; }
.cd-outcome-pie-wrap { display: flex; justify-content: center; margin-top: 18px; }
.cd-outcome-pie-box { position: relative; width: 150px; height: 150px; }
.cd-outcome-pie-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cd-outcome-pie-svg path { cursor: pointer; transition: opacity 0.15s; }

.attribution { text-align: center; font-size: 11px; color: var(--text-quaternary); margin-top: 24px; }
</style>
</head>
<body>

<main>
  <div class="hdr-title">Golf Stats</div>

  <div class="hole-toggle" id="holeToggle">
    <button type="button" data-h="9" class="active">9 Holes</button>

  <!-- Handicap -->
  <div class="card">
    <div class="card-eyebrow">Handicap Index</div>
    <div class="hcp-num-row"><span class="hcp-num" id="hcpNum">—</span><span class="hcp-tier" id="hcpTier"></span></div>
    <div class="hcp-note" id="hcpNote"></div>
    <div class="hcp-range" id="hcpRange">
      <button type="button" data-r="1m">Last month</button>
      <button type="button" data-r="6m">Last 6mo</button>
      <button type="button" data-r="all" class="active">All time</button>
    </div>
    <svg class="hcp-chart-svg" id="hcpChartSvg" viewBox="0 0 600 90" preserveAspectRatio="none"></svg>
  </div>

  <!-- Stat tiles -->
  <div class="stat-grid" id="statGrid"></div>

  <!-- Hole outcomes pie -->
  <div class="card">
    <div class="card-eyebrow">Hole Outcomes</div>
    <div class="pie-wrap">
      <div class="pie-svg-box"><svg class="pie-svg" id="pieSvg" viewBox="0 0 100 100"></svg></div>
      <div class="pie-legend" id="pieLegend"></div>
    </div>
  </div>

  <!-- Putting -->
  <div class="card">
    <div class="card-eyebrow">Putting</div>
    <div class="putt-layout">
      <div class="putt-side-tile">
        <div class="putt-side-val" id="puttAvgVal">—</div>
        <div class="putt-side-label">AVG PUTTS<br><span id="puttAvgHolesLabel">/ 9H</span></div>
      </div>
      <div class="putt-main">
        <div class="putt-tabs" id="puttTabs">
          <button type="button" data-p="1" class="active">1-Putt</button>
          <button type="button" data-p="2">2-Putt</button>
          <button type="button" data-p="3">3-Putt+</button>
        </div>
        <svg class="putt-chart-svg" id="puttChartSvg" viewBox="0 0 600 90" preserveAspectRatio="none"></svg>
        <div class="putt-pct-row"><span class="putt-pct" id="puttPct">—</span><span class="putt-pct-label" id="puttPctLabel">of holes</span></div>
      </div>
    </div>
    <div class="putt-note" id="puttNote"></div>
  </div>

  <!-- Courses -->
  <div class="card">
    <div class="card-eyebrow">Courses Played</div>
    <div class="course-toolbar">
      <button type="button" class="course-fav-toggle" id="courseFavToggle">★ Favorites only</button>
    </div>
    <div class="course-carousel-mobile" id="courseCarouselMobile"></div>
    <div class="course-grid-desktop" id="courseGridDesktop"></div>
  </div>

  <!-- Rounds -->
  <div class="card">
    <div class="card-eyebrow">Rounds</div>
    <div class="filter-chips" id="courseFilterChips"></div>
    <div id="roundsList"></div>
    <button class="view-more-btn" id="viewMoreBtn" type="button" hidden>View more</button>
  </div>

  <div class="attribution">tap a round for the scorecard, tap a course for its stats</div>
</main>

<!-- Course "view more" modal (desktop) -->
<div class="course-modal-overlay" id="courseModalOverlay" hidden>
  <div class="course-modal">
    <div class="course-modal-head">
      <span class="course-modal-title">All Courses</span>
      <button class="rd-close" id="courseModalClose" type="button">×</button>
    </div>
    <div class="course-modal-grid" id="courseModalGrid"></div>
  </div>
</div>

<!-- Round detail sheet -->
<div class="rd-overlay" id="rdOverlay" hidden>
  <div class="rd-sheet">
    <div class="rd-head">
      <div>
        <div class="rd-title" id="rdTitle">—</div>
        <div class="rd-sub" id="rdSub">—</div>
      </div>
      <button class="rd-close" id="rdClose" type="button">×</button>
    </div>
    <div class="rd-score-row">
      <div class="rd-score-tile hue-blue"><div class="rd-score-big" id="rdScore">—</div><div class="rd-score-sub">Score</div></div>
      <div class="rd-score-tile hue-green"><div class="rd-score-big" id="rdPutts">—</div><div class="rd-score-sub">Putts</div></div>
      <div class="rd-score-tile hue-gold"><div class="rd-score-big" id="rdDiff">—</div><div class="rd-score-sub">Differential</div></div>
    </div>
    <div id="rdTableWrap"></div>
  </div>
</div>

<!-- Course detail sheet -->
<div class="rd-overlay" id="courseDetailOverlay" hidden>
  <div class="rd-sheet cd-sheet">
    <div class="cd-hero" id="cdHero">
      <button class="cd-hero-close" id="cdClose" type="button">×</button>
      <label class="cd-hero-upload" id="cdUploadLabel"><i data-lucide="camera"></i><input type="file" accept="image/*" id="cdUploadInput"></label>
      <div class="cd-hero-shade"></div>
      <div class="cd-hero-body">
        <div class="cd-hero-name" id="cdTitle">—</div>
        <div class="cd-hero-sub" id="cdSub">—</div>
      </div>
    </div>
    <div class="cd-content">
      <div class="cd-facts-row" id="cdFactsRow"></div>

      <div class="cd-section-label" id="cdAvgLabel" hidden>Average Score</div>
      <div id="cdAvgWrap" hidden>
        <div class="cd-avg-num" id="cdAvgNum">—</div>
        <div class="cd-avg-note" id="cdAvgNote"></div>
        <svg class="cd-avg-chart-svg" id="cdAvgChartSvg"></svg>
      </div>

      <div class="cd-section-label" id="cdStatLabel" hidden>Other Stats</div>
      <div class="cd-stat-grid" id="cdStatGrid"></div>

      <div id="cdBreakdownWrap"></div>
    </div>
  </div>
</div>

<script>
(function () {
  function storeGet(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw == null ? fallback : JSON.parse(raw); } catch (e) { return fallback; }
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function fmtDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    return mo + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  // ===== Data (same store golf.html uses) =====
  function loadRounds() { const r = storeGet('golf:rounds', []); return Array.isArray(r) ? r : []; }
  function loadCourses() { const c = storeGet('golf:courses', {}); return (c && typeof c === 'object') ? c : {}; }

  // Expects rounds already scoped to one hole-count (9 or 18) — the
  // handicap number and its trend genuinely change with the top toggle
  // instead of always blending both into one WHS-style figure.
  //
  // A handicap index is always meant to represent 18-hole-equivalent
  // ability, even when it's built from 9-hole rounds — the standard
  // convention (and what you'd get from a real WHS calc) is to double a
  // 9-hole differential before averaging, so "9 Holes" mode isn't showing
  // a smaller, not-comparable number just because half as many holes went
  // into each round. 18-hole rounds need no scaling — their differential
  // is already 18-hole-native.
  function computeHandicapIndex(rounds) {
    const withDiff = rounds.slice()
      .filter(r => typeof r.differential === 'number')
      .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.ts || 0) - (b.ts || 0));
    if (withDiff.length < 3) return null;
    const last20 = withDiff.slice(-20).map(r => (r.holes || 18) === 9 ? r.differential * 2 : r.differential);
    const best = last20.slice().sort((a, b) => a - b).slice(0, Math.min(8, last20.length));
    return Math.round((best.reduce((a, b) => a + b, 0) / best.length) * 10) / 10;
  }
  function tierFor(h) {
    if (h <= 5) return 'Low / Scratch';
    if (h <= 14) return 'Mid Handicap';
    if (h <= 22) return 'High / Average';
    if (h <= 32) return 'Recreational';
    return 'Beginner';
  }

  let holesFilter = 9;
  let hcpRange = 'all';
  let courseFilter = null;
  let roundsShown = 5;

  function allGolfRounds() { return loadRounds(); }
  function filteredByHoles(rounds) { return rounds.filter(r => (r.holes || 18) === holesFilter); }

  // ===== Smoothed line path, same technique used elsewhere in the app =====
  function smoothPath(points) {
    if (points.length < 2) return '';
    if (points.length === 2) return 'M' + points[0].x + ',' + points[0].y + ' L' + points[1].x + ',' + points[1].y;
    const d = ['M' + points[0].x + ',' + points[0].y];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i], p1 = points[i], p2 = points[i + 1], p3 = points[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d.push('C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + p2.x + ',' + p2.y);
    }
    return d.join(' ');
  }
  function animateLineDrawIn(svgId, animatedFlags) {
    if (animatedFlags[svgId]) return;
    animatedFlags[svgId] = true;
    const path = document.querySelector('#' + svgId + ' .draw-line');
    if (!path) return;
    const len = path.getTotalLength();
    path.style.transition = 'none';
    path.style.strokeDasharray = String(len);
    path.style.strokeDashoffset = String(len);
    path.getBoundingClientRect();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        path.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(.22,.7,.2,1)';
        path.style.strokeDashoffset = '0';
      });
    });
  }
  const animatedOnce = {};

  // Tooltip element lives once per chart, created lazily and reused —
  // absolutely positioned against the SVG's own wrapping .card.
  function ensureTooltipEl(svg) {
    let tip = svg.parentElement.querySelector('.chart-tip');
    if (!tip) {
      tip = document.createElement('div');
      tip.className = 'chart-tip';
      tip.style.cssText = 'position:absolute;pointer-events:none;background:#0d0d0e;border:1px solid var(--border-strong);border-radius:8px;padding:6px 9px;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-115%);z-index:5;display:none;box-shadow:0 6px 18px rgba(0,0,0,0.4)';
      svg.parentElement.style.position = svg.parentElement.style.position || 'relative';
      svg.parentElement.appendChild(tip);
    }
    return tip;
  }
  function fmtShortDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T12:00:00');
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate();
  }
  function fmtMonthLabel(ym) {
    if (!ym) return '';
    const [y, m] = ym.split('-').map(Number);
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1] + ' ' + y;
  }

  function renderTrendChart(svgId, points, color, valueLabel, labelFn) {
    const svg = document.getElementById(svgId);
    if (points.length < 2) { svg.innerHTML = '<text x="300" y="45" fill="var(--text-tertiary)" font-size="12" text-anchor="middle">Not enough rounds yet</text>'; return; }
    const W = 600, H = 90, pad = 6;
    const vals = points.map(p => p.v);
    const min = Math.min(...vals), max = Math.max(...vals), range = Math.max(1, max - min);
    const pts = points.map((p, i) => ({ x: pad + (i / (points.length - 1)) * (W - pad * 2), y: H - pad - ((p.v - min) / range) * (H - pad * 2), date: p.date, v: p.v }));
    const line = smoothPath(pts);
    const area = line + ' L' + pts[pts.length - 1].x + ',' + H + ' L' + pts[0].x + ',' + H + ' Z';
    const gradId = svgId + 'Grad';
    svg.innerHTML =
      '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.35"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>'
      + '<path d="' + area + '" fill="url(#' + gradId + ')" stroke="none"></path>'
      + '<path class="draw-line" d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px ' + color + ')"></path>'
      + '<circle cx="' + pts[pts.length - 1].x + '" cy="' + pts[pts.length - 1].y + '" r="3" fill="' + color + '"></circle>'
      + '<line class="hv-line" x1="0" y1="0" x2="0" y2="' + H + '" stroke="' + color + '" stroke-width="1" opacity="0.4" hidden></line>'
      + '<circle class="hv-dot" r="3.5" fill="' + color + '" stroke="#0d0d0e" stroke-width="1.5" hidden></circle>'
      + '<rect class="hv-hit" x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent" style="cursor:pointer;touch-action:none"></rect>';
    animateLineDrawIn(svgId, animatedOnce);

    // Hover/touch scrub — tap or drag along the line to see the exact
    // date + value at that point, same interaction the rest of the app's
    // charts already use.
    const tip = ensureTooltipEl(svg);
    const hvLine = svg.querySelector('.hv-line'), hvDot = svg.querySelector('.hv-dot'), hit = svg.querySelector('.hv-hit');
    function nearest(mx) { let best = pts[0], bestD = Infinity; pts.forEach(p => { const d = Math.abs(p.x - mx); if (d < bestD) { bestD = d; best = p; } }); return best; }
    function showAt(clientX) {
      const rect = hit.getBoundingClientRect();
      const mx = ((clientX - rect.left) / rect.width) * W;
      const p = nearest(mx);
      hvLine.setAttribute('x1', p.x); hvLine.setAttribute('x2', p.x); hvLine.hidden = false;
      hvDot.setAttribute('cx', p.x); hvDot.setAttribute('cy', p.y); hvDot.hidden = false;
      tip.style.left = (p.x / W * 100) + '%';
      tip.style.top = (p.y / H * 100) + '%';
      tip.innerHTML = '<strong>' + p.v + (valueLabel ? ' ' + valueLabel : '') + '</strong><div style="color:var(--text-tertiary);font-size:10px;margin-top:1px">' + (labelFn ? labelFn(p.date) : fmtShortDate(p.date)) + '</div>';
      tip.style.display = 'block';
    }
    function hideTip() { hvLine.hidden = true; hvDot.hidden = true; tip.style.display = 'none'; }
    hit.onmousemove = e => showAt(e.clientX);
    hit.onmouseleave = hideTip;
    let hideTimer = null;
    hit.ontouchstart = e => { e.preventDefault(); showAt(e.touches[0].clientX); clearTimeout(hideTimer); };
    hit.ontouchmove = e => { e.preventDefault(); showAt(e.touches[0].clientX); clearTimeout(hideTimer); };
    hit.ontouchend = () => { hideTimer = setTimeout(hideTip, 1500); };
  }

  // ===== Handicap section =====
  function rangeStartDate() {
    const d = new Date();
    if (hcpRange === '6m') d.setMonth(d.getMonth() - 6);
    else if (hcpRange === '1m') d.setMonth(d.getMonth() - 1);
    else return null;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function renderHandicapSection() {
    const rounds = filteredByHoles(allGolfRounds());
    const h = computeHandicapIndex(rounds);
    document.getElementById('hcpNum').textContent = h == null ? '—' : h;
    const tierEl = document.getElementById('hcpTier');
    if (h == null) { tierEl.style.display = 'none'; } else { tierEl.style.display = 'inline-block'; tierEl.textContent = tierFor(h); }
    document.getElementById('hcpNote').textContent = h == null
      ? (rounds.length) + '/3 ' + holesFilter + '-hole rounds needed for an estimate.'
      : 'Best 8 of your last 20 ' + holesFilter + '-hole rounds — not an official WHS index.';

    // Rolling handicap over time: recompute the index using only rounds
    // known up to each point (within this hole-count), so the chart
    // shows genuine improvement rather than raw differential noise.
    const chrono = rounds.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.ts || 0) - (b.ts || 0));
    const start = rangeStartDate();
    const series = [];
    for (let i = 0; i < chrono.length; i++) {
      const upTo = chrono.slice(0, i + 1);
      const idx = computeHandicapIndex(upTo);
      if (idx != null) series.push({ date: chrono[i].date, v: idx });
    }
    const scoped = start ? series.filter(p => p.date >= start) : series;
    renderTrendChart('hcpChartSvg', scoped, 'var(--accent)', 'hcp');
  }
  document.getElementById('hcpRange').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      hcpRange = btn.dataset.r;
      document.getElementById('hcpRange').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      renderHandicapSection();
    });
  });

  // ===== Stat tiles =====
  function renderStatTiles() {
    const rounds = filteredByHoles(allGolfRounds());
    const grid = document.getElementById('statGrid');
    if (!rounds.length) {
      grid.innerHTML = '<div class="stat-tile" style="grid-column:1/-1">No ' + holesFilter + '-hole rounds yet</div>';
      return;
    }
    const scores = rounds.map(r => r.score).filter(n => typeof n === 'number');
    const best = Math.min(...scores);
    const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
    const puttsArr = rounds.map(r => r.putts).filter(n => typeof n === 'number');
    const avgPutts = puttsArr.length ? puttsArr.reduce((a, b) => a + b, 0) / puttsArr.length : null;
    const tiles = [
      { label: 'Rounds', val: rounds.length, best: false },
      { label: 'Best Score', val: best, best: true },
      { label: 'Avg Score', val: avg.toFixed(1), best: false },
      { label: 'Avg Putts', val: avgPutts != null ? avgPutts.toFixed(1) : '—', best: false }
    ];
    grid.innerHTML = tiles.map(t =>
      '<div class="stat-tile' + (t.best ? ' best' : '') + '"><div class="stat-tile-val">' + t.val + '</div><div class="stat-tile-label">' + t.label + '</div></div>'
    ).join('');
  }

  // ===== Hole outcomes pie =====
  const OUTCOME_META = [
    { key: 'eagles', name: 'Eagles', color: 'var(--eagle)' },
    { key: 'birdies', name: 'Birdies', color: 'var(--birdie)' },
    { key: 'pars', name: 'Pars', color: 'var(--par)' },
    { key: 'bogeys', name: 'Bogeys', color: 'var(--bogey)' },
    { key: 'doubleBogeys', name: 'Doubles', color: 'var(--double)' },
    { key: 'triplePlus', name: 'Triple+', color: 'var(--triple)' }
  ];
  function donutArcPath(cx, cy, rOuter, rInner, a1, a2) {
    const x1o = cx + rOuter * Math.cos(a1), y1o = cy + rOuter * Math.sin(a1);
    const x2o = cx + rOuter * Math.cos(a2), y2o = cy + rOuter * Math.sin(a2);
    const x1i = cx + rInner * Math.cos(a2), y1i = cy + rInner * Math.sin(a2);
    const x2i = cx + rInner * Math.cos(a1), y2i = cy + rInner * Math.sin(a1);
    const large = (a2 - a1) > Math.PI ? 1 : 0;
    return 'M' + x1o.toFixed(2) + ' ' + y1o.toFixed(2) + ' A' + rOuter + ' ' + rOuter + ' 0 ' + large + ' 1 ' + x2o.toFixed(2) + ' ' + y2o.toFixed(2)
      + ' L' + x1i.toFixed(2) + ' ' + y1i.toFixed(2) + ' A' + rInner + ' ' + rInner + ' 0 ' + large + ' 0 ' + x2i.toFixed(2) + ' ' + y2i.toFixed(2) + ' Z';
  }

  // Hover/tap a slice -> a leader line from its outer edge out to a
  // floating name+count callout, same interaction on any donut built
  // with donutArcPath (the main Hole Outcomes pie and the course-detail
  // one both use this). `svg` must sit inside a position:relative box
  // sized to exactly match it (percentage math below assumes that).
  function ensurePieCalloutEls(svg) {
    const box = svg.parentElement;
    box.style.position = box.style.position || 'relative';
    let line = svg.querySelector('.pie-leader-line');
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('class', 'pie-leader-line');
      line.setAttribute('stroke-width', '1.2');
      line.setAttribute('opacity', '0');
      svg.appendChild(line);
    }
    let dot = svg.querySelector('.pie-leader-dot');
    if (!dot) {
      dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', 'pie-leader-dot');
      dot.setAttribute('r', '2.2');
      dot.setAttribute('opacity', '0');
      svg.appendChild(dot);
    }
    let label = box.querySelector('.pie-callout');
    if (!label) {
      label = document.createElement('div');
      label.className = 'pie-callout';
      box.appendChild(label);
    }
    return { line, dot, label };
  }
  function wirePieHover(svg, slices) {
    // slices: [{ el, mid (radians), name, count, color }]
    const { line, dot, label } = ensurePieCalloutEls(svg);
    const cx = 50, cy = 50, rInner = 46, rOuter = 60;
    function show(s) {
      const x1 = cx + rInner * Math.cos(s.mid), y1 = cy + rInner * Math.sin(s.mid);
      const x2 = cx + rOuter * Math.cos(s.mid), y2 = cy + rOuter * Math.sin(s.mid);
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', s.color); line.setAttribute('opacity', '0.9');
      dot.setAttribute('cx', x1); dot.setAttribute('cy', y1);
      dot.setAttribute('fill', s.color); dot.setAttribute('opacity', '1');
      label.style.left = x2 + '%'; label.style.top = y2 + '%';
      label.style.borderColor = s.color; label.style.color = s.color;
      label.innerHTML = '<b>' + s.name + '</b><span class="pie-callout-n">' + s.count + '</span>';
      label.style.display = 'block';
      slices.forEach(o => { o.el.style.opacity = (o === s) ? '1' : '0.35'; });
    }
    function hide() {
      line.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); label.style.display = 'none';
      slices.forEach(o => { o.el.style.opacity = '1'; });
    }
    slices.forEach(s => {
      s.el.addEventListener('mouseenter', () => show(s));
      s.el.addEventListener('touchstart', e => { e.preventDefault(); show(s); }, { passive: false });
    });
    svg.addEventListener('mouseleave', hide);
    let hideTimer = null;
    svg.addEventListener('touchend', () => { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 1800); });
  }
  let pieAnimatedIn = false;
  function renderPie() {
    const rounds = filteredByHoles(allGolfRounds());
    const totals = {};
    OUTCOME_META.forEach(m => totals[m.key] = 0);
    rounds.forEach(r => OUTCOME_META.forEach(m => totals[m.key] += (r[m.key] || 0)));
    const grand = Object.values(totals).reduce((a, b) => a + b, 0);
    const svg = document.getElementById('pieSvg');
    const legend = document.getElementById('pieLegend');
    if (!grand) {
      svg.innerHTML = '<circle cx="50" cy="50" r="46" fill="var(--bg-input)"></circle>';
      legend.innerHTML = '<div style="color:var(--text-tertiary);font-size:12px">No hole data yet for this filter.</div>';
      return;
    }
    let angle = -Math.PI / 2;
    let html = '';
    const sliceMeta = [];
    OUTCOME_META.forEach((m, i) => {
      const v = totals[m.key];
      if (!v) return;
      const sliceAngle = (v / grand) * Math.PI * 2;
      const pad = 0.015;
      const a1 = angle + pad, a2 = angle + sliceAngle - pad;
      const mid = angle + sliceAngle / 2;
      if (a2 > a1) {
        html += '<path class="pie-slice" data-i="' + i + '" d="' + donutArcPath(50, 50, 46, 30, a1, a2) + '" fill="' + m.color + '" style="transform-origin:50px 50px"></path>';
        sliceMeta.push({ mid, name: m.name, count: v, color: m.color });
      }
      angle += sliceAngle;
    });
    svg.innerHTML = html;
    const pathEls = svg.querySelectorAll('.pie-slice');
    wirePieHover(svg, sliceMeta.map((s, i) => Object.assign({ el: pathEls[i] }, s)));
    if (!pieAnimatedIn) {
      pieAnimatedIn = true;
      pathEls.forEach(el => { el.style.opacity = '0'; el.style.transform = 'scale(0.5)'; });
      requestAnimationFrame(() => {
        pathEls.forEach((el, i) => {
          el.style.transition = 'opacity 0.7s ease ' + (i * 90) + 'ms, transform 0.7s cubic-bezier(.34,1.56,.64,1) ' + (i * 90) + 'ms';
          el.style.opacity = '1'; el.style.transform = 'scale(1)';
        });
      });
    }
    legend.innerHTML = OUTCOME_META.map(m => {
      const v = totals[m.key];
      const pct = grand ? Math.round(v / grand * 100) : 0;
      return '<div class="pie-leg-row"><span class="pie-leg-dot" style="background:' + m.color + '"></span><span class="pie-leg-name">' + m.name + '</span><span class="pie-leg-val">' + v + ' · ' + pct + '%</span></div>';
    }).join('');
  }

  let puttTab = 1; // 1, 2, or 3 (3 means "3-putt or worse")

  const PUTT_TAB_NAME = { 1: '1-putt', 2: '2-putt', 3: '3-putt+' };

  function renderPutting() {
    const rounds = filteredByHoles(allGolfRounds()).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.ts || 0) - (b.ts || 0));

    // Left tile — average putts per round, scoped to the current 9/18 toggle.
    const puttsArr = rounds.map(r => r.putts).filter(n => typeof n === 'number');
    document.getElementById('puttAvgVal').textContent = puttsArr.length ? (puttsArr.reduce((a, b) => a + b, 0) / puttsArr.length).toFixed(1) : '—';
    document.getElementById('puttAvgHolesLabel').textContent = '/ ' + holesFilter + 'H';

    // 1/2/3-putt breakdown needs per-hole data (holeByHole) — only
    // present on rounds the Golfshot import has enriched so far. Grouped
    // by month rather than by round — a point per round made the line
    // too noisy/spiky to read as a trend, monthly rates show the real
    // improvement over time instead.
    let totalHoles = 0;
    const totals = { 1: 0, 2: 0, 3: 0 };
    const byMonth = {};
    rounds.forEach(r => {
      const hbh = (r.holeByHole || []).filter(h => typeof h.putts === 'number' && h.putts > 0);
      if (!hbh.length || !r.date) return;
      const ym = r.date.slice(0, 7);
      const bucket = byMonth[ym] || (byMonth[ym] = { holes: 0, counts: { 1: 0, 2: 0, 3: 0 } });
      hbh.forEach(h => { const k = h.putts >= 3 ? 3 : h.putts; bucket.counts[k]++; totals[k]++; });
      bucket.holes += hbh.length;
      totalHoles += hbh.length;
    });
    const months = Object.keys(byMonth).sort();
    const series = { 1: [], 2: [], 3: [] };
    months.forEach(ym => {
      const b = byMonth[ym];
      [1, 2, 3].forEach(k => { series[k].push({ date: ym, v: Math.round(b.counts[k] / b.holes * 100) }); });
    });

    const note = document.getElementById('puttNote');
    if (!totalHoles) {
      note.textContent = 'Per-hole putt detail is still backfilling — this fills in automatically as it does.';
    } else {
      note.textContent = totalHoles + ' holes with putt detail across ' + months.length + ' month' + (months.length === 1 ? '' : 's') + '.';
    }

    renderTrendChart('puttChartSvg', series[puttTab], PUTT_TAB_COLOR[puttTab], '%', fmtMonthLabel);
    document.getElementById('puttPct').textContent = totalHoles ? Math.round(totals[puttTab] / totalHoles * 100) + '%' : '—';
    document.getElementById('puttPctLabel').textContent = 'of holes are ' + PUTT_TAB_NAME[puttTab];
  }

  // Downscale + compress an uploaded photo before storing as a data URL —
  // same reasoning as every other image-upload spot in this app: a raw
  // phone photo is way bigger than localStorage should hold.
  function downscaleImage(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function courseCardHtml(c, images, favs) {
    const key = c.name.toLowerCase();

      + '<label class="course-card-upload" data-upload="' + esc(c.name) + '"><i data-lucide="camera"></i><input type="file" accept="image/*"></label>'
      + '<div class="course-card-body"><div class="course-card-name">' + esc(c.name) + '</div><div class="course-card-sub">' + c.count + ' round' + (c.count === 1 ? '' : 's') + '</div></div>'

  function wireCourseCards(container) {
    container.querySelectorAll('.course-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-fav]') || e.target.closest('[data-upload]')) return;
        openCourseDetail(card.dataset.course);
      });
    });
    container.querySelectorAll('[data-fav]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.dataset.fav.toLowerCase();
        let favs = loadFavoriteCourses();
        favs = favs.includes(key) ? favs.filter(f => f !== key) : favs.concat(key);
        saveFavoriteCourses(favs);
        renderCourseList();
      });
    });
    container.querySelectorAll('[data-upload]').forEach(label => {
      const input = label.querySelector('input');
      label.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;
        downscaleImage(file, (dataUrl) => {
          const images = loadCourseImages();
          images[label.dataset.upload.toLowerCase()] = dataUrl;
          saveCourseImages(images);
          renderCourseList();
        });

  function renderCourseList() {

    if (diff === 0) return 'rd-cell-par';

  function openCourseDetail(courseName) {
    const rounds = filteredByHoles(allGolfRounds()).filter(r => r.course === courseName);
    document.getElementById('cdTitle').textContent = courseName;
    document.getElementById('cdSub').textContent = rounds.length + ' ' + holesFilter + '-hole round' + (rounds.length === 1 ? '' : 's') + ' played';
    renderCdHero(courseName);

    const courses = loadCourses();
    const courseInfo = courses[courseName.toLowerCase()] || {};
    const par = holesFilter === 9 ? courseInfo.par9 : courseInfo.par18;
    document.getElementById('cdFactsRow').innerHTML =
      '<div class="cd-fact"><div class="cd-fact-val">' + (par != null ? par : '—') + '</div><div class="cd-fact-label">Par</div></div>'
      + '<div class="cd-fact"><div class="cd-fact-val">' + (courseInfo.slope != null ? courseInfo.slope : '—') + '</div><div class="cd-fact-label">Slope</div></div>'
      + '<div class="cd-fact"><div class="cd-fact-val">' + holesFilter + '</div><div class="cd-fact-label">Holes</div></div>';

    const statGrid = document.getElementById('cdStatGrid');
    const breakdownWrap = document.getElementById('cdBreakdownWrap');
    const avgLabel = document.getElementById('cdAvgLabel');
    const avgWrap = document.getElementById('cdAvgWrap');
    if (!rounds.length) {
      document.getElementById('cdStatLabel').style.display = 'none';
      avgLabel.hidden = true; avgWrap.hidden = true;
      statGrid.innerHTML = '';
      breakdownWrap.innerHTML = '<div class="rd-no-holes">No ' + holesFilter + '-hole rounds logged at this course yet — switch the toggle at the top to check the other hole count.</div>';
      cdOverlay.hidden = false;
      return;
    }

    const chronoRounds = rounds.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.ts || 0) - (b.ts || 0));
    const scores = rounds.map(r => r.score).filter(v => v != null);
    const avgScore = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length * 10) / 10 : null;
    const bestScore = scores.length ? Math.min(...scores) : null;
    const putts = rounds.map(r => r.putts).filter(v => v != null);
    const avgPutts = putts.length ? Math.round(putts.reduce((a, b) => a + b, 0) / putts.length * 10) / 10 : null;
    const sumField = k => rounds.reduce((a, r) => a + (r[k] || 0), 0);

    // Average score, with a rolling trend line the same way the
    // Handicap Index card works — under the Par/Slope/Holes facts row.
    avgLabel.hidden = false; avgWrap.hidden = false;
    document.getElementById('cdAvgNum').textContent = avgScore != null ? avgScore : '—';
    document.getElementById('cdAvgNote').textContent = (bestScore != null ? 'Best ' + bestScore + ' · ' : '') + rounds.length + ' round' + (rounds.length === 1 ? '' : 's');
    renderTrendChart('cdAvgChartSvg', chronoRounds.filter(r => r.score != null).map(r => ({ date: r.date, v: r.score })), 'var(--accent)', '');

    document.getElementById('cdStatLabel').style.display = '';
    statGrid.innerHTML =
      '<div class="cd-stat-tile"><div class="cd-stat-tile-val">' + rounds.length + '</div><div class="cd-stat-tile-label">Times Played</div></div>'
      + '<div class="cd-stat-tile"><div class="cd-stat-tile-val">' + (bestScore != null ? bestScore : '—') + '</div><div class="cd-stat-tile-label">Best Score</div></div>'
      + '<div class="cd-stat-tile"><div class="cd-stat-tile-val">' + (avgPutts != null ? avgPutts : '—') + '</div><div class="cd-stat-tile-label">Avg Putts</div></div>';

    // Hole outcomes — a table (name/icon, count, %) with a donut chart
    // underneath summarizing the same breakdown, reusing the same
    // OUTCOME_META/donutArcPath the main Hole Outcomes card uses.
    // 'bird' (bigger, an eagle in flight) vs 'feather' (smaller, a birdie)
    // gives the two best outcomes distinct bird-themed icons since lucide
    // has no literal eagle glyph — the rest just need something recognizable.
    const breakdownIcons = { eagles: 'bird', birdies: 'feather', pars: 'flag', bogeys: 'circle-minus', doubleBogeys: 'trending-down', triplePlus: 'circle-alert' };
    const breakdownIconSize = { eagles: '19px', birdies: '13px' };
    const totalsByKey = {};
    OUTCOME_META.forEach(m => totalsByKey[m.key] = sumField(m.key));
    const grandTotal = Object.values(totalsByKey).reduce((a, b) => a + b, 0);
    if (!grandTotal) {
      breakdownWrap.innerHTML = '';
    } else {
      const rows = OUTCOME_META.map(m => {
        const v = totalsByKey[m.key];
        const pct = Math.round(v / grandTotal * 100);
        const size = breakdownIconSize[m.key];
        return '<div class="cd-outcome-row"><i data-lucide="' + breakdownIcons[m.key] + '" class="cd-outcome-icon" style="color:' + m.color + (size ? ';width:' + size + ';height:' + size : '') + '"></i>'
          + '<div class="cd-outcome-name">' + m.name + '</div>'
          + '<div class="cd-outcome-count">' + v + '</div><div class="cd-outcome-pct">' + pct + '%</div></div>';
      }).join('');

      let angle = -Math.PI / 2, pieHtml = '';
      const cdSliceMeta = [];
      OUTCOME_META.forEach(m => {
        const v = totalsByKey[m.key];
        if (!v) return;
        const sliceAngle = (v / grandTotal) * Math.PI * 2;
        const pad = 0.015;
        const a1 = angle + pad, a2 = angle + sliceAngle - pad;
        const mid = angle + sliceAngle / 2;
        if (a2 > a1) {
          pieHtml += '<path class="pie-slice" d="' + donutArcPath(50, 50, 46, 30, a1, a2) + '" fill="' + m.color + '"></path>';
          cdSliceMeta.push({ mid, name: m.name, count: v, color: m.color });
        }
        angle += sliceAngle;
      });

      breakdownWrap.innerHTML = '<div class="cd-breakdown-eyebrow">Hole Outcomes</div>'
        + '<div class="cd-outcome-table">' + rows + '</div>'
        + '<div class="cd-outcome-pie-wrap"><div class="cd-outcome-pie-box"><svg class="cd-outcome-pie-svg" viewBox="0 0 100 100">' + pieHtml + '</svg></div></div>';
      const cdPieSvg = breakdownWrap.querySelector('.cd-outcome-pie-svg');
      const cdPathEls = cdPieSvg.querySelectorAll('.pie-slice');
      wirePieHover(cdPieSvg, cdSliceMeta.map((s, i) => Object.assign({ el: cdPathEls[i] }, s)));
    }
    if (typeof lucide !== 'undefined') lucide.createIcons();
    cdOverlay.hidden = false;
  }
  document.getElementById('cdClose').addEventListener('click', () => { cdOverlay.hidden = true; });
  cdOverlay.addEventListener('click', (e) => { if (e.target === cdOverlay) cdOverlay.hidden = true; });

  // ===== Global toggle + render orchestration =====
  function renderHoleScopedSections() {
    renderHandicapSection();
    renderStatTiles();
    renderPie();
    renderPutting();
  }
  function renderAll() {
    renderHoleScopedSections();
    renderCourseList();
    renderCourseFilterChips();
    renderRoundsList();
  }
  document.getElementById('holeToggle').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      holesFilter = +btn.dataset.h;
      document.getElementById('holeToggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      renderHoleScopedSections();
    });
  });

  renderAll();
  window.addEventListener('storage', renderAll);
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({
      appKey: 'golf',
      syncedKeys: ['golf:rounds', 'golf:courses'],
      onApplied: function () { window.dispatchEvent(new Event('storage')); }
    });
  });
})();
</script>
