<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-dark: #0c0c0d;
  --bg-input: rgba(0, 0, 0, 0.28);

  --border: rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.12);

  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;

  --accent: #1D9E75;
  --carbs: #4DD6C4;
  --fat: #B794F4;
  --protein: #FBBF24;
  --fiber: #7DD3FC;
  --steps: #E07658;
  --distance: #6EE7B7;
  --creatine: #FF8A4D;

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-heading: "Fraunces", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
/* Health had no light theme at all — the toggle existed but did
   nothing. Built to match the cream/forest palette now standard across
   the app's light mode (see golf.html, the Fitness Workouts prototype). */
:root[data-theme="light"] {
  --bg: #F4EFE3;
  --bg-card: #FFFFFF;
  --bg-dark: #0F2A24;
  --bg-input: rgba(46,46,46,0.06);
  --border: rgba(46,46,46,0.08);
  --border-soft: rgba(46,46,46,0.04);
  --border-strong: rgba(46,46,46,0.16);
  --text-primary: #2E2E2E;
  --text-secondary: #5A5A54;
  --text-tertiary: #8C8C86;
  --text-quaternary: #C7C4B8;
  --accent: #003B2F;
  --carbs: #C2A46F;
  --fat: #6B4F8A;
  --protein: #8A6B3F;
  --fiber: #4A6B5C;
  --steps: #A9673D;
  --distance: #2F6B52;
  --creatine: #7A4A2E;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-secondary); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 90px; padding-top: max(20px, env(safe-area-inset-top, 20px)); }

/* ===== Header ===== */
.hdr-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px; }
.hdr-title { font-family: var(--font-heading); font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-primary); margin: 0 0 14px; }

/* ===== Date strip — same structure as gym-preview.html's calendar
   review (date-nav/date-strip/date-cell): a real navigable week view,
   not a fixed snapshot. Tapping a past day shows that day's numbers
   in the cards below instead of always today's. ===== */
.date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.date-nav-btn {
  width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--border); flex: none;
  background: var(--bg-card); color: var(--text-secondary); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent;
}
.date-nav-btn:disabled { opacity: 0.3; cursor: default; }
.date-nav-btn:not(:disabled):active { color: var(--text-primary); border-color: var(--border-strong); }
.date-nav-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.02em; }
.date-nav-label.is-jump { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.date-strip { display: flex; gap: 6px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.date-strip::-webkit-scrollbar { display: none; }
.date-cell {
  flex: 1 0 40px; min-width: 40px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; font-family: inherit;
}
.date-cell-dow { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.7; }
.date-cell-num { font-size: 14px; font-weight: 800; }
.date-cell.is-today { background: var(--accent); border-color: var(--accent); color: #04140f; }
.date-cell.is-selected:not(.is-today) { border-color: var(--accent); color: var(--text-primary); }
.date-cell-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); position: absolute; bottom: 4px; }
.date-cell.is-today .date-cell-dot { background: #04140f; opacity: 0.85; }
[data-theme="light"] .date-cell.is-today { color: #FAFAFA; }
[data-theme="light"] .date-cell.is-today .date-cell-dot { background: #FAFAFA; }
.date-cell.is-future { opacity: 0.35; cursor: default; }

/* ===== Cards ===== */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 12px; position: relative; }
.card-tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card-tap:active { background: rgba(255,255,255,0.06); }

.tile-edit-btn {
  position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  z-index: 2;
}
.tile-edit-btn:active { background: rgba(255,255,255,0.14); color: var(--text-primary); }
.tile-edit-btn svg { width: 13px; height: 13px; }

.cal-label { font-size: 13px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 8px; }
.cal-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.cal-num { font-size: 26px; font-weight: 800; color: var(--text-primary); }
.cal-goal { font-size: 14px; color: var(--text-tertiary); font-weight: 500; }
.cal-left { font-size: 13px; color: var(--text-secondary); text-align: right; }
.bar-track { height: 8px; border-radius: 999px; background: var(--bg-input); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s; }

.macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.macro-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
.macro-card .tile-edit-btn { width: 22px; height: 22px; top: 8px; right: 8px; }
.macro-card .tile-edit-btn svg { width: 11px; height: 11px; }
.macro-card:active { background: rgba(255,255,255,0.06); }
.macro-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.macro-val { font-size: 17px; font-weight: 800; color: var(--text-primary); }
.macro-goal { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
.macro-bar { height: 5px; border-radius: 999px; background: var(--bg-input); overflow: hidden; margin-top: 8px; }
.macro-bar-fill { height: 100%; border-radius: 999px; }

.dark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.dark-card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 16px; padding: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.dark-card:active { background: #111113; }
.dark-label { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.dark-sub { font-size: 11px; color: var(--text-quaternary); margin: 2px 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
/* .dark-card stays a dark forest tile in both themes (deliberate — a
   spotlight surface), so its own text must stay light-on-dark even
   when the page around it flips to the light palette's dark-on-light
   tokens. */
[data-theme="light"] .dark-label { color: #FAFAFA; }
[data-theme="light"] .dark-sub { color: rgba(250,250,250,0.55); }
.dark-val { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
.mini-bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
.mini-bar { flex: 1; border-radius: 2px 2px 0 0; opacity: 0.85; }

.creatine-row { display: flex; align-items: center; justify-content: space-between; }
.creatine-check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; -webkit-tap-highlight-color: transparent; color: var(--text-tertiary); flex-shrink: 0; }
.creatine-check.on { background: var(--creatine); border-color: var(--creatine); color: #1a0a02; }
.creatine-streak { display: flex; gap: 5px; margin-top: 10px; }
.creatine-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
.creatine-dot.hit { background: var(--creatine); }

/* ===== Weekly modal ===== */
.wk-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; }
.wk-overlay[hidden] { display: none; }
.wk-sheet { background: #0d0d0e; border: 1px solid var(--border-strong); border-top-left-radius: 22px; border-top-right-radius: 22px; width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 20px max(20px, env(safe-area-inset-bottom, 20px)); }
.wk-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.wk-title { font-size: 17px; font-weight: 800; color: var(--text-primary); }
.wk-close { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-input); border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
.wk-total-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); }
.wk-total-val { font-size: 26px; font-weight: 800; color: var(--text-primary); margin: 4px 0 20px; }
.wk-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 140px; gap: 8px; margin-bottom: 8px; }
.wk-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 6px; }
.wk-bar { width: 100%; border-radius: 5px 5px 0 0; min-height: 3px; }
.wk-bar-label { font-size: 11px; color: var(--text-quaternary); font-weight: 600; }

.attribution { text-align: center; font-size: 11px; color: var(--text-quaternary); margin-top: 24px; }
</style>
</head>
<body>

<main>
  <div class="hdr-eyebrow" id="hdrDate">—</div>
  <div class="hdr-title" id="hdrTitle">Today</div>

  <div class="date-nav">
    <button type="button" class="date-nav-btn" id="dateNavPrev" aria-label="Previous week">‹</button>
    <span class="date-nav-label" id="dateNavLabel">This week</span>
    <button type="button" class="date-nav-btn" id="dateNavNext" aria-label="Next week" disabled>›</button>
  </div>
  <div class="date-strip" id="dateStrip"></div>

  <!-- Calories -->
  <div class="card card-tap" id="calCard">
    <button type="button" class="tile-edit-btn" id="calEditBtn" aria-label="Edit calorie goal"><i data-lucide="pencil"></i></button>
    <div class="cal-label">Calories</div>
    <div class="cal-row">
      <div><span class="cal-num" id="calNum">—</span><span class="cal-goal"> cal / <span id="calGoal">—</span></span></div>
      <div class="cal-left" id="calLeft">—</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="calBar" style="width:0%"></div></div>
  </div>

  <!-- Macros: Carbs / Fat / Protein / Fiber -->
  <div class="macro-grid">
    <div class="macro-card" data-macro="carbsG">
      <button type="button" class="tile-edit-btn" data-edit-macro="carbsG" aria-label="Edit carbs goal"><i data-lucide="pencil"></i></button>
      <div class="macro-name" style="color:var(--carbs)">Carbs</div>
      <div class="macro-val"><span class="mval">—</span><span class="macro-goal"> / <span class="mgoal">—</span>g</span></div>
      <div class="macro-bar"><div class="macro-bar-fill" style="background:var(--carbs)"></div></div>
    </div>
    <div class="macro-card" data-macro="fatG">
      <button type="button" class="tile-edit-btn" data-edit-macro="fatG" aria-label="Edit fat goal"><i data-lucide="pencil"></i></button>
      <div class="macro-name" style="color:var(--fat)">Fat</div>
      <div class="macro-val"><span class="mval">—</span><span class="macro-goal"> / <span class="mgoal">—</span>g</span></div>
      <div class="macro-bar"><div class="macro-bar-fill" style="background:var(--fat)"></div></div>
    </div>
    <div class="macro-card" data-macro="proteinG">
      <button type="button" class="tile-edit-btn" data-edit-macro="proteinG" aria-label="Edit protein goal"><i data-lucide="pencil"></i></button>
      <div class="macro-name" style="color:var(--protein)">Protein</div>
      <div class="macro-val"><span class="mval">—</span><span class="macro-goal"> / <span class="mgoal">—</span>g</span></div>
      <div class="macro-bar"><div class="macro-bar-fill" style="background:var(--protein)"></div></div>
    </div>
    <div class="macro-card" data-macro="fiberG">
      <button type="button" class="tile-edit-btn" data-edit-macro="fiberG" aria-label="Edit fiber goal"><i data-lucide="pencil"></i></button>
      <div class="macro-name" style="color:var(--fiber)">Fiber</div>
      <div class="macro-val"><span class="mval">—</span><span class="macro-goal"> / <span class="mgoal">—</span>g</span></div>
      <div class="macro-bar"><div class="macro-bar-fill" style="background:var(--fiber)"></div></div>
    </div>
  </div>

  <!-- Steps + Distance -->
  <div class="dark-grid">
    <div class="dark-card" id="stepsCard">
      <div class="dark-label">Step Count</div>
      <div class="dark-sub">Today</div>
      <div class="dark-val" style="color:var(--steps)" id="stepsVal">—</div>
      <div class="mini-bars" id="stepsMini"></div>
    </div>
    <div class="dark-card" id="distCard">
      <div class="dark-label">Step Distance</div>
      <div class="dark-sub">Today</div>
      <div class="dark-val" style="color:var(--distance)" id="distVal">—</div>
      <div class="mini-bars" id="distMini"></div>
    </div>
  </div>

  <!-- Creatine -->
  <div class="card">
    <div class="creatine-row">
      <div>
        <div class="cal-label" style="margin-bottom:2px">Creatine</div>
        <div style="font-size:13px;color:var(--text-secondary)" id="creatineSub">Not taken yet today</div>
      </div>
      <div class="creatine-check" id="creatineCheck">✓</div>
    </div>
    <div class="creatine-streak" id="creatineStreak"></div>
  </div>

  <div class="attribution">tap the pencil to set a real goal</div>
</main>

<!-- Weekly detail sheet -->
<div class="wk-overlay" id="wkOverlay" hidden>
  <div class="wk-sheet">
    <div class="wk-head">
      <div class="wk-title" id="wkTitle">—</div>
      <button class="wk-close" id="wkClose" type="button">×</button>
    </div>
    <div class="wk-total-label">7-DAY TOTAL</div>
    <div class="wk-total-val" id="wkTotal">—</div>
    <div class="wk-chart" id="wkChart"></div>
  </div>
</div>

<script>
(function () {
  function storeGet(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw == null ? fallback : JSON.parse(raw); } catch (e) { return fallback; }
  }
  function storeSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function last7Dates() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    return out;
  }
  const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

  const DEFAULT_GOALS = { calories: 2500, proteinG: 150, carbsG: 300, fatG: 80, fiberG: 30, steps: 8000 };

  function goals() { return Object.assign({}, DEFAULT_GOALS, storeGet('health:goals', {})); }

  // ===== Date strip — same structure as gym-preview.html's calendar
  // review: a real navigable week view (weekOffset pages it back/forward
  // 7 days at a time), not a fixed snapshot. Tapping a past day shows
  // that day's numbers in the cards below instead of always today's.
  let selectedDateKey = todayKey();
  let weekOffset = 0;

  function renderDateStrip() {
    const today = new Date();
    const tKey = todayKey();
    const dow = today.getDay(); // 0=Sun..6=Sat
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(today); monday.setDate(today.getDate() + mondayOffset + weekOffset * 7);
    const steps = storeGet('health:steps', {});
    const nutrition = storeGet('health:nutrition', {});
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      cells.push({
        key, d,
        isToday: key === tKey,
        isFuture: d > today && key !== tKey,
        hasData: steps[key] != null || (nutrition[key] && nutrition[key].calories),
      });
    }
    document.getElementById('dateStrip').innerHTML = cells.map(c => {
      const sel = c.key === selectedDateKey;
      return '<button type="button" class="date-cell' + (c.isToday ? ' is-today' : '') + (sel && !c.isToday ? ' is-selected' : '') + (c.isFuture ? ' is-future' : '') + '" data-key="' + c.key + '"' + (c.isFuture ? ' disabled' : '') + '>'
        + '<span class="date-cell-dow">' + DOW[c.d.getDay()] + '</span>'
        + '<span class="date-cell-num">' + c.d.getDate() + '</span>'
        + (c.hasData ? '<span class="date-cell-dot"></span>' : '')
        + '</button>';
    }).join('');
    document.querySelectorAll('.date-cell:not([disabled])').forEach(btn => {
      btn.addEventListener('click', () => selectDate(btn.dataset.key));
    });
    const label = document.getElementById('dateNavLabel');
    label.textContent = weekOffset === 0 ? 'This week'
      : cells[0].d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' – ' + cells[6].d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    label.classList.toggle('is-jump', weekOffset !== 0);
    document.getElementById('dateNavNext').disabled = weekOffset >= 0;

    const selD = new Date(selectedDateKey + 'T12:00:00');
    const titleEl = document.getElementById('hdrTitle');
    if (titleEl) titleEl.textContent = selectedDateKey === tKey ? 'Today' : selD.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    const eyebrowEl = document.getElementById('hdrDate');
    if (eyebrowEl) eyebrowEl.textContent = selD.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    document.querySelectorAll('.dark-sub').forEach(el => { el.textContent = selectedDateKey === tKey ? 'Today' : selD.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); });
  }
  function selectDate(key) {
    selectedDateKey = key;
    renderDateStrip();
    renderCalories();
    renderStepsDistance();
    renderCreatine();
  }
  document.getElementById('dateNavPrev').addEventListener('click', () => { weekOffset--; renderDateStrip(); });
  document.getElementById('dateNavNext').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; renderDateStrip(); } });
  document.getElementById('dateNavLabel').addEventListener('click', () => { if (weekOffset !== 0) { weekOffset = 0; renderDateStrip(); } });

  function renderCalories() {
    const nutrition = storeGet('health:nutrition', {});
    const today = nutrition[selectedDateKey] || {};
    const g = goals();
    const cal = Math.round(today.calories || 0);
    const left = g.calories - cal;
    document.getElementById('calNum').textContent = cal.toLocaleString();
    document.getElementById('calGoal').textContent = g.calories.toLocaleString();
    document.getElementById('calLeft').textContent = (left >= 0 ? left.toLocaleString() + ' left' : Math.abs(left).toLocaleString() + ' over');
    document.getElementById('calBar').style.width = Math.min(100, (cal / g.calories) * 100) + '%';

    document.querySelectorAll('.macro-card').forEach(card => {
      const key = card.dataset.macro;
      const val = Math.round(today[key] || 0);
      const goalVal = g[key];
      card.querySelector('.mval').textContent = val;
      card.querySelector('.mgoal').textContent = goalVal;
      card.querySelector('.macro-bar-fill').style.width = Math.min(100, (val / goalVal) * 100) + '%';
    });
  }

  function miniBars(el, values, color) {
    const max = Math.max(1, ...values);
    el.innerHTML = values.map(v => '<div class="mini-bar" style="height:' + Math.max(6, (v / max) * 100) + '%;background:' + color + '"></div>').join('');
  }

  function renderStepsDistance() {
    const steps = storeGet('health:steps', {});
    const distance = storeGet('health:distance', {});
    const unit = storeGet('health:distanceUnit', 'mi');
    const dates = last7Dates();
    const daySteps = steps[selectedDateKey];
    const dayDist = distance[selectedDateKey];

    document.getElementById('stepsVal').textContent = daySteps == null ? '—' : daySteps.toLocaleString();
    document.getElementById('distVal').textContent = dayDist == null ? '—' : dayDist.toFixed(2) + unit;
    miniBars(document.getElementById('stepsMini'), dates.map(dk => steps[dk] || 0), 'var(--steps)');
    miniBars(document.getElementById('distMini'), dates.map(dk => distance[dk] || 0), 'var(--distance)');
  }

  function renderCreatine() {
    const log = storeGet('health:creatine', {});
    const dates = last7Dates();
    const taken = !!log[selectedDateKey];
    const check = document.getElementById('creatineCheck');
    check.classList.toggle('on', taken);
    document.getElementById('creatineSub').textContent = taken ? 'Taken' : 'Not taken';
    document.getElementById('creatineStreak').innerHTML = dates.map(dk =>
      '<div class="creatine-dot' + (log[dk] ? ' hit' : '') + '"></div>'
    ).join('');
  }

  function renderAll() {
    renderDateStrip();
    renderCalories();
    renderStepsDistance();
    renderCreatine();
  }

  // ===== Weekly detail sheet =====
  const wkOverlay = document.getElementById('wkOverlay');
  function openWeekly(title, color, unit, getValueForDate) {
    const dates = last7Dates();
    const values = dates.map(getValueForDate);
    const total = values.reduce((a, b) => a + b, 0);
    const max = Math.max(1, ...values);
    document.getElementById('wkTitle').textContent = title;
    document.getElementById('wkTotal').textContent = (Math.round(total * 10) / 10).toLocaleString() + (unit ? unit : '');
    const chartEl = document.getElementById('wkChart');
    chartEl.innerHTML = dates.map((dk, i) => {
      const d = new Date(dk + 'T12:00:00');
      const h = Math.max(3, (values[i] / max) * 100);
      return '<div class="wk-bar-wrap"><div class="wk-bar" data-h="' + h + '" style="height:0%;background:' + color + '"></div>'
        + '<div class="wk-bar-label">' + DOW[d.getDay()] + '</div></div>';
    }).join('');
    wkOverlay.hidden = false;
    // Fill up, staggered left to right — every time the sheet opens,
    // not just once, since this is a modal rather than a persistent
    // page section.
    const bars = chartEl.querySelectorAll('.wk-bar');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bars.forEach((el, i) => {
          el.style.transition = 'height 0.9s cubic-bezier(.22,.7,.2,1) ' + (i * 70) + 'ms';
          el.style.height = el.dataset.h + '%';
        });
      });
    });
  }
  document.getElementById('wkClose').addEventListener('click', () => { wkOverlay.hidden = true; });
  wkOverlay.addEventListener('click', (e) => { if (e.target === wkOverlay) wkOverlay.hidden = true; });

  document.getElementById('calCard').addEventListener('click', () => {
    const nutrition = storeGet('health:nutrition', {});
    openWeekly('Calories', 'var(--accent)', ' cal', dk => (nutrition[dk] || {}).calories || 0);
  });
  document.querySelectorAll('.macro-card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.macro;
      const label = card.querySelector('.macro-name').textContent;
      const color = getComputedStyle(card.querySelector('.macro-name')).color;
      const nutrition = storeGet('health:nutrition', {});
      openWeekly(label, color, 'g', dk => (nutrition[dk] || {})[key] || 0);
    });
  });
  document.getElementById('stepsCard').addEventListener('click', () => {
    const steps = storeGet('health:steps', {});
    openWeekly('Step Count', 'var(--steps)', '', dk => steps[dk] || 0);
  });
  document.getElementById('distCard').addEventListener('click', () => {
    const distance = storeGet('health:distance', {});
    const unit = storeGet('health:distanceUnit', 'mi');
    openWeekly('Step Distance', 'var(--distance)', unit, dk => distance[dk] || 0);
  });

  document.getElementById('creatineCheck').addEventListener('click', () => {
    const log = storeGet('health:creatine', {});
    log[selectedDateKey] = !log[selectedDateKey];
    storeSet('health:creatine', log);
    renderCreatine();
  });

  // Tap the pencil in a tile's corner to edit its goal — simple
  // prompt-based for this draft; a proper settings modal can replace
  // this once the layout itself is signed off.
  document.getElementById('calEditBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const g = goals();
    const v = prompt('Daily calorie goal:', g.calories);
    if (v && !isNaN(v)) { g.calories = Number(v); storeSet('health:goals', g); renderCalories(); }
  });
  document.querySelectorAll('[data-edit-macro]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.editMacro;
      const card = btn.closest('.macro-card');
      const label = card.querySelector('.macro-name').textContent;
      const g = goals();
      const v = prompt(label + ' goal (g):', g[key]);
      if (v && !isNaN(v)) { g[key] = Number(v); storeSet('health:goals', g); renderCalories(); }
    });
  });

  renderAll();
  window.addEventListener('storage', renderAll);
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({
      appKey: 'health-metrics',
      syncedKeys: ['health:steps', 'health:nutrition', 'health:distance', 'health:distanceUnit', 'health:goals', 'health:creatine'],
      onApplied: function () { window.dispatchEvent(new Event('storage')); }
    });
  });
})();
</script>

</body>
</html>
