<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>

<style>
/* ===== Shared design tokens (same as the rest of the dashboard) ===== */
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  min-height: 100vh; position: relative; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
/* Soft drifting glow + dot texture (matches the other pages). */
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224,118,88,0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180,180,200,0.06), transparent 50%);
  filter: blur(40px); pointer-events: none; z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px; pointer-events: none; z-index: -1;
}
@keyframes drift { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-22px,14px,0)} }

/* ===== Vitality atmospheric backdrop — same aurora/mountains/particles
   system as the Finance page (ported, toned down), so moving between
   the hub and Finance doesn't feel like leaving the app. Layers sit
   at z-index 0/1/2, below .page (z-index 5). ===== */
.vty-atmosphere {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(60% 50% at 50% 30%, rgba(110, 231, 183, 0.11) 0%, rgba(110, 231, 183, 0.04) 32%, rgba(110, 231, 183, 0) 65%),
    radial-gradient(28% 22% at 50% 38%, rgba(255, 226, 181, 0.05) 0%, rgba(255, 226, 181, 0) 70%),
    radial-gradient(120% 80% at 50% 100%, rgba(14, 38, 30, 0.4) 0%, rgba(4, 6, 10, 0.9) 75%);
  background-repeat: no-repeat; background-size: 100% 100%;
}
.vty-mountains {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1;
  height: 26vh; min-height: 150px; pointer-events: none; opacity: 0.65;
}
.vty-mountains svg { width: 100%; height: 100%; display: block; }
.vty-particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.vty-particles span {
  position: absolute; width: 1.5px; height: 1.5px;
  background: rgba(233, 239, 233, 0.6); border-radius: 50%;
  animation: vty-backdrop-drift linear infinite;
  box-shadow: 0 0 6px rgba(167, 243, 208, 0.45);
}
@keyframes vty-backdrop-drift {
  0%   { transform: translate3d(0, 0, 0); opacity: 0; }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.45; }
  100% { transform: translate3d(var(--dx, 12px), var(--dy, -100vh), 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .vty-particles span { animation: none; } }

.page { position: relative; z-index: 5; max-width: 1100px; margin: 0 auto; }
.dash-title {
  margin: 0 0 18px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== BENTO GRID ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: minmax(168px, auto);
  grid-auto-flow: dense;
  gap: 14px;
}
.tile {
  --accent: #6BE3A4;                 /* each tile overrides this */
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 20px;
  border-radius: 18px;
  text-decoration: none;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
/* The "its own style" bit — a faint accent glow per tile. */
.tile::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 78% 18%,
              color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%);
  opacity: 0.7; transition: opacity 0.18s ease;
}
.tile:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  box-shadow: 0 16px 48px rgba(0,0,0,0.55);
}
.tile:hover::before { opacity: 1; }
/* Main is a snapshot panel, not a link — no hover lift, no pointer cursor. */
.tile-noclick { cursor: default; }
.tile-noclick:hover { transform: none; box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
.tile-noclick:hover::before { opacity: 0.7; }

/* Tile sizes */
.tile.big  { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }

/* Groups Fitness/Finance/Golf so the desktop layout (below) can turn
   them into a stacked right-hand column. display:contents means at
   every other width its children behave exactly as if they were
   direct children of .bento — the existing masonry is unaffected. */
.bento-right { display: contents; }

/* A ticker/price/24h% row shown inside the Finance tile when the
   Finance page has fetched at least one live stock price. Empty by
   default (no snapshot yet) — the JS below only fills it in and
   removes [hidden] once there's real data. */
.stock-snapshot { display: flex; flex-direction: column; gap: 4px; margin: 10px 0 2px; }
.stock-snapshot[hidden] { display: none; }
.stock-snapshot-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 12px; font-family: var(--font-mono);
}
.stock-snapshot-ticker { color: var(--text-secondary); font-weight: 600; }
.stock-snapshot-price { color: var(--text-primary); }
.stock-snapshot-chg { font-weight: 700; flex-shrink: 0; }
.stock-snapshot-chg.up   { color: #6BE3A4; }
.stock-snapshot-chg.down { color: #FF8A8A; }

/* A tile that needs an interactive control floating on top of it
   (e.g. the creatine check on the Main tile) gets wrapped — the
   wrapper takes over the grid placement, stretches the tile to fill
   it via flex (not absolute+inset:0 — that took the tile out of flow
   entirely, so its real content height never reached the grid track,
   which silently clipped it on mobile since grid-auto-rows was a
   fixed length shorter than the actual content), and the button sits
   absolutely positioned on top of the now-normal-flow tile. */
.tile-wrap { position: relative; }
.tile-wrap-big { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; }
.tile-wrap-big .tile.big { flex: 1; grid-column: unset; grid-row: unset; }
.creatine-btn {
  position: absolute; z-index: 5; top: 20px; right: 20px;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px 7px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(10,10,11,0.55);
  backdrop-filter: blur(8px);
  color: var(--text-secondary);
  font-family: var(--font); font-size: 11.5px; font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.creatine-btn:hover { background: rgba(10,10,11,0.7); }
.creatine-check {
  width: 16px; height: 16px; flex-shrink: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.28);
  position: relative;
  transition: background 0.2s, border-color 0.2s;
}
.creatine-btn.done { border-color: rgba(107,227,164,0.5); background: rgba(107,227,164,0.12); color: #6BE3A4; }
.creatine-btn.done .creatine-check { background: #6BE3A4; border-color: #6BE3A4; }
.creatine-btn.done .creatine-check::after {
  content: ''; position: absolute; left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: solid #0A0A0B; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
@media (max-width: 440px) {
  .creatine-btn { top: 14px; right: 14px; font-size: 10.5px; padding: 6px 10px 6px 7px; }
}

/* Tile contents */
.tile-top { display: flex; align-items: flex-start; justify-content: space-between; }
.tile-num {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.08em; color: var(--text-tertiary);
}
.tile-emoji {
  font-size: 26px; line-height: 1;
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 60%, transparent));
}
.tile-spacer { flex: 1; }
.tile-title {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--text-primary); margin: 0 0 4px;
}
.tile.big .tile-title { font-size: 28px; }
/* Hero stat — a real live number (today's split, handicap index)
   instead of a static one-line description, matching Finance's
   hero-number treatment for its net worth figure. */
.tile-hero-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.tile-hero-val {
  font-size: 20px; font-weight: 800; color: var(--text-primary);
  line-height: 1.15; margin: 1px 0 2px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tile-sub {
  font-size: 13px; color: var(--text-tertiary);
}
.tile-arrow {
  font-size: 18px; color: var(--accent);
  transition: transform 0.18s ease; flex-shrink: 0;
}
.tile:hover .tile-arrow { transform: translateX(4px); }

/* ===== Main snapshot panel widgets ===== */
.tile-top:has(.tile-title-inline) { justify-content: flex-start; gap: 10px; }
.tile-title-inline { font-size: 20px; margin: 0; }

.main-stat-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 16px 0;
}
.main-stat {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
}
.main-stat-val {
  font-size: 17px; font-weight: 700; color: var(--text-primary);
  font-variant-numeric: tabular-nums; line-height: 1.1;
}
.main-stat-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary); margin-top: 5px;
}

.main-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-tertiary); margin: 16px 0 8px;
}

.main-nw-row { display: flex; align-items: center; gap: 14px; }
.main-nw-pie {
  width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.06);
  position: relative;
}
.main-nw-pie::after {
  content: ''; position: absolute; inset: 14px;
  border-radius: 50%; background: #0b0b0c;
}
.main-nw-info { min-width: 0; flex: 1; }
.main-nw-total {
  font-size: 20px; font-weight: 700; color: var(--text-primary);
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.main-nw-legend { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.main-nw-legend-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-tertiary);
}
.main-nw-legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.main-empty {
  font-size: 11px; font-style: italic; color: var(--text-tertiary);
  padding: 4px 0 2px;
}
.main-empty[hidden] { display: none; }

/* ===== Responsive: collapse the bento on small screens ===== */
@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(150px, auto); }
  .tile.big { grid-column: span 2; grid-row: span 1; }
  .tile.big .tile-title { font-size: 22px; }
  .tile-wrap-big { grid-column: span 2; grid-row: span 1; }
}
@media (max-width: 440px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .bento { grid-template-columns: 1fr; grid-auto-rows: minmax(132px, auto); }
  .tile { padding: 16px; }
  .tile.big, .tile.wide { grid-column: span 1; }
  .tile-wrap-big { grid-column: span 1; }
}

/* ===== Desktop: 50/50 split — Main (snapshot panel) fills the left
   half. The right half is Fitness + Golf side by side on top (each
   a quarter of the page width) with Finance spanning full width
   underneath. ===== */
@media (min-width: 900px) {
  .bento {
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: unset;
    grid-template-rows: 1fr;
    align-items: stretch;
    min-height: 640px;
  }
  .tile-wrap-big { grid-column: 1; grid-row: 1; }
  .bento-right {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
    grid-column: 2; grid-row: 1;
    min-height: 0;
  }
  .bento-right .tile { min-height: 0; }
  .bento-right .tile-right-big { grid-column: 1 / -1; grid-row: 2; }
}

/* ===== Header row + gear ===== */
.hub-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.hub-head .dash-title { margin: 0; }
.gear-btn {
  width: 42px; height: 42px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-secondary);
  cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.gear-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
.gear-btn:active { transform: scale(0.94) rotate(35deg); }
.gear-btn svg { width: 22px; height: 22px; }

/* ===== Settings modal ===== */
.modal-bg {
  position: fixed; inset: 0; z-index: 120; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  background: #0e0e10; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px; padding: 22px; box-shadow: 0 24px 70px rgba(0,0,0,0.6);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.modal-close { border: 0; background: transparent; color: var(--text-tertiary); font-size: 26px; line-height: 1; cursor: pointer; padding: 0 4px; }
.modal-close:hover { color: var(--text-primary); }
.field { margin-bottom: 14px; }
.field-label { font-size: 11px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 7px; display: block; }
.field-row { display: flex; gap: 8px; align-items: center; }
.set-input {
  flex: 1; min-width: 0; padding: 11px 13px;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 11px;
  background: rgba(0,0,0,0.3); color: var(--text-primary);
  font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s;
}
.set-input:focus { border-color: rgba(255,255,255,0.28); }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.10); border-radius: 11px; overflow: hidden; flex-shrink: 0; }
.seg button { border: 0; background: transparent; color: var(--text-tertiary); font-family: inherit; font-size: 13px; font-weight: 600; padding: 11px 14px; cursor: pointer; transition: background 0.15s, color 0.15s; }
.seg button.on { background: rgba(255,255,255,0.12); color: var(--text-primary); }
.set-save {
  width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 12px;
  background: linear-gradient(180deg,#FFFFFF,#E8E5DD); color: #0A0A0B;
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 22px rgba(0,0,0,0.25);
  transition: filter 0.15s, transform 0.1s;
}
.set-save:hover { filter: brightness(1.05); }
.set-save:active { transform: translateY(1px); }
.set-status { text-align: center; font-size: 12px; color: var(--success); min-height: 16px; margin-top: 8px; }
.section-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 20px 0 14px; }
.whoop-box { margin-top: 8px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); }
.whoop-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.whoop-status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
.whoop-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #76746E; }
.whoop-status.on .dot { background: #6BE3A4; box-shadow: 0 0 8px rgba(107,227,164,0.7); }
.whoop-sync { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); text-align: right; }
.whoop-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 14px; }
.whoop-stat { text-align: center; }
.whoop-stat .v { font-size: 20px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; line-height: 1; }
.whoop-stat .l { font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-top: 5px; }
.whoop-btn { width: 100%; margin-top: 14px; padding: 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 11px; background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.15s, color 0.15s; }
.whoop-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }

/* ===== Light theme overrides =====
   Additive only — the rules above are untouched, so dark mode
   (the default, no [data-theme] attribute) can't regress. */
:root[data-theme="light"] {
  --text-primary: #1C1B17;
  --text-secondary: #5B584E;
  --text-tertiary: #8A8676;
  color-scheme: light;
}
[data-theme="light"] body { background: #F5F3EF; }
[data-theme="light"] body::before {
  background:
    radial-gradient(circle at 82% 14%, rgba(224,118,88,0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(120,120,140,0.08), transparent 50%);
}
[data-theme="light"] body::after {
  background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
}
[data-theme="light"] .dash-title {
  background: linear-gradient(180deg, #1C1B17 0%, #5B584E 120%);
  -webkit-background-clip: text; background-clip: text;
}
[data-theme="light"] .tile {
  background: #FFFFFF;
  border-color: rgba(20,18,15,0.08);
  box-shadow: 0 12px 32px rgba(20,18,15,0.10);
}
[data-theme="light"] .tile:hover {
  box-shadow: 0 16px 40px rgba(20,18,15,0.14);
}
[data-theme="light"] .gear-btn {
  background: #FFFFFF;
  border-color: rgba(20,18,15,0.12);
}
[data-theme="light"] .gear-btn:hover { background: #F0EEE9; }
[data-theme="light"] .modal-bg { background: rgba(20,18,15,0.35); }
[data-theme="light"] .modal {
  background: #FFFFFF;
  border-color: rgba(20,18,15,0.10);
  box-shadow: 0 24px 60px rgba(20,18,15,0.18);
}
[data-theme="light"] .set-input {
  background: #F5F3EF;
  border-color: rgba(20,18,15,0.12);
}
[data-theme="light"] .set-input:focus { border-color: rgba(20,18,15,0.30); }
[data-theme="light"] .seg { border-color: rgba(20,18,15,0.12); }
[data-theme="light"] .seg button.on { background: rgba(20,18,15,0.10); color: var(--text-primary); }
[data-theme="light"] .set-save {
  background: linear-gradient(180deg,#1C1B17,#33312A);
  color: #FAFAF8;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 20px rgba(20,18,15,0.18);
}
[data-theme="light"] .whoop-box {
  background: rgba(20,18,15,0.03);
  border-color: rgba(20,18,15,0.08);
}
[data-theme="light"] .whoop-btn { border-color: rgba(20,18,15,0.14); }
[data-theme="light"] .whoop-btn:hover { background: rgba(20,18,15,0.05); }
[data-theme="light"] .section-divider { background: rgba(20,18,15,0.08); }
</style>
</head>
<body>
<!-- ===== Vitality atmospheric backdrop (aurora · mountains · particles) —
     same system as the Finance page, toned down, so the hub and
     Finance feel like one app. ===== -->

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const WATER_KEY = 'po_water_v1';
  const WHOOP_KEY = 'whoop_tokens_v1';
  const SYNC_KEY  = 'whoop_last_sync';

  function loadJSON(k, f) { try { return JSON.parse(localStorage.getItem(k)) || f; } catch (e) { return f; } }
  function saveJSON(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

  // Mirror of topbar.js defaultWaterState so we never clobber the water tracker.
  function defaultWater() {
    return { unit:'bottle', bottleMl:500, glassMl:250, weightUnit:'kg',
      profile:{ weightKg:75, age:25, sex:'m', activityHrsPerWeek:5 },
      caffeineMgPerDay:200, substances:[], logs:{} };
  }

  /* ---------- unit state ---------- */
  let heightUnit = 'cm';   // 'cm' | 'ft'
  let weightUnit = 'kg';   // 'kg' | 'lb'
  let sex = 'm';

  function setHeightUnit(u) {
    heightUnit = u;
    $('heightUnitSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.u === u));
    const a = $('heightA'), b = $('heightB');
    if (u === 'cm') { a.placeholder = 'cm'; b.style.display = 'none'; }
    else { a.placeholder = 'ft'; b.placeholder = 'in'; b.style.display = ''; }
  }
  function setWeightUnit(u) {
    weightUnit = u;
    $('weightUnitSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.u === u));
  }
  function setSex(s) {
    sex = s;
    $('sexSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  }

  function getHeightCm() {
    if (heightUnit === 'cm') { const v = parseFloat($('heightA').value); return v > 0 ? v : null; }
    const ft = parseFloat($('heightA').value) || 0;
    const inch = parseFloat($('heightB').value) || 0;
    const cm = ft * 30.48 + inch * 2.54;
    return cm > 0 ? Math.round(cm) : null;
  }
  function fillHeight(cm) {
    if (!cm) { $('heightA').value = ''; $('heightB').value = ''; return; }
    if (heightUnit === 'cm') { $('heightA').value = Math.round(cm); }
    else { const totalIn = cm / 2.54; $('heightA').value = Math.floor(totalIn / 12); $('heightB').value = Math.round(totalIn % 12); }
  }

  /* ---------- load existing profile into the form ---------- */
  function populate() {
    const w = loadJSON(WATER_KEY, defaultWater());
    const p = w.profile || {};
    setWeightUnit(w.weightUnit === 'lb' ? 'lb' : 'kg');
    setHeightUnit(p.heightUnit === 'ft' ? 'ft' : 'cm');
    setSex(p.sex === 'f' ? 'f' : 'm');
    fillHeight(p.heightCm || null);
    if (p.weightKg) $('weight').value = weightUnit === 'lb' ? Math.round(p.weightKg * 2.20462) : Math.round(p.weightKg);
    else $('weight').value = '';
    $('age').value = p.age || '';
    $('activity').value = (p.activityHrsPerWeek != null ? p.activityHrsPerWeek : '');
  }

  /* ---------- save back into po_water_v1 (merge, never overwrite logs) ---------- */
  function save() {
    const w = loadJSON(WATER_KEY, defaultWater());
    w.profile = w.profile || {};
    const cm = getHeightCm();
    if (cm) { w.profile.heightCm = cm; w.profile.heightUnit = heightUnit; }
    const wv = parseFloat($('weight').value);
    if (wv > 0) { w.profile.weightKg = weightUnit === 'lb' ? +(wv / 2.20462).toFixed(1) : wv; w.weightUnit = weightUnit; }
    const age = parseInt($('age').value, 10); if (age > 0) w.profile.age = age;
    w.profile.sex = sex;
    const act = parseFloat($('activity').value); if (act >= 0 && !isNaN(act)) w.profile.activityHrsPerWeek = act;
    saveJSON(WATER_KEY, w);
    const s = $('settingsStatus'); s.textContent = 'Saved ✓';
    setTimeout(() => { s.textContent = ''; }, 1800);
  }

  /* ---------- open / close ---------- */
  function open() { populate(); renderWhoop(); $('settingsBg').classList.add('show'); syncWhoop(); }
  function close() { $('settingsBg').classList.remove('show'); }
  $('settingsOpen').addEventListener('click', open);
  $('settingsClose').addEventListener('click', close);
  $('settingsBg').addEventListener('click', (e) => { if (e.target === $('settingsBg')) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  $('settingsSave').addEventListener('click', save);
  $('heightUnitSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const cm = getHeightCm(); setHeightUnit(b.dataset.u); fillHeight(cm);
  }));
  $('weightUnitSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const v = parseFloat($('weight').value);
    const kg = v > 0 ? (weightUnit === 'lb' ? v / 2.20462 : v) : null;
    setWeightUnit(b.dataset.u);
    if (kg) $('weight').value = weightUnit === 'lb' ? Math.round(kg * 2.20462) : Math.round(kg);
  }));
  $('sexSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => setSex(b.dataset.s)));

  /* ---------- WHOOP ---------- */
  let whStats = null;
  function relTime(ts) {
    if (!ts) return 'never';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + ' min ago';
    if (s < 86400) return Math.floor(s/3600) + ' h ago';
    return Math.floor(s/86400) + ' d ago';
  }
  function renderWhoop(err) {
    const t = loadJSON(WHOOP_KEY, null);
    const statusEl = $('whStatus'), txt = $('whStatusText'), syncEl = $('whSync'), action = $('whAction');
    if (!t || !t.access) {
      statusEl.classList.remove('on'); txt.textContent = 'Not connected';
      syncEl.textContent = ''; $('whStats').style.display = 'none';
      action.textContent = 'Connect on Health page';
      return;
    }
    statusEl.classList.add('on'); txt.textContent = err ? 'Connected (sync failed)' : 'Connected';
    const last = Number(localStorage.getItem(SYNC_KEY)) || 0;
    syncEl.textContent = 'Last synced ' + relTime(last);
    action.textContent = 'Sync now';
    if (whStats) {
      $('whStats').style.display = '';
      $('whRec').textContent   = whStats.rec   != null ? whStats.rec + '%'  : '—';
      $('whSleep').textContent = whStats.sleep != null ? whStats.sleep + '%' : '—';
      $('whRhr').textContent   = whStats.rhr   != null ? whStats.rhr         : '—';
    }
  }
  async function wRefresh(t) {
    if (!t.refresh) return null;
    try {
      const r = await fetch('/api/whoop-refresh', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ refresh_token: t.refresh }) });
      const j = await r.json();
      if (j.access_token) { const n = { access:j.access_token, refresh:j.refresh_token||t.refresh, expires:Date.now()+(j.expires_in||3500)*1000 }; saveJSON(WHOOP_KEY, n); return n; }
    } catch (e) {}
    return null;
  }
  async function wFetch(path, t) {
    const [p, qs] = path.split('?');
    const params = new URLSearchParams(qs || ''); params.set('path', p);
    const r = await fetch('/api/whoop-data?' + params.toString(), { headers: { 'Authorization': 'Bearer ' + t.access, 'Accept':'application/json' } });
    if (r.status === 401) { const n = await wRefresh(t); if (n) return wFetch(path, n); throw new Error('unauthorized'); }
    if (!r.ok) throw new Error('whoop ' + r.status);
    return r.json();
  }
  async function syncWhoop() {
    let t = loadJSON(WHOOP_KEY, null);
    if (!t || !t.access) return;
    if (t.expires && Date.now() > t.expires - 60000) { const n = await wRefresh(t); if (n) t = n; }
    try {
      const [rec, sleep] = await Promise.all([
        wFetch('/recovery?limit=1', t).catch(()=>null),
        wFetch('/activity/sleep?limit=1', t).catch(()=>null),
      ]);
      const r0 = rec && rec.records && rec.records[0];
      const s0 = sleep && sleep.records && sleep.records[0];
      whStats = {
        rec:   r0 && r0.score && r0.score.recovery_score != null ? Math.round(r0.score.recovery_score) : null,
        rhr:   r0 && r0.score && r0.score.resting_heart_rate != null ? Math.round(r0.score.resting_heart_rate) : null,
        sleep: s0 && s0.score && s0.score.sleep_performance_percentage != null ? Math.round(s0.score.sleep_performance_percentage) : null,
      };
      localStorage.setItem(SYNC_KEY, String(Date.now()));
      renderWhoop();
    } catch (e) { renderWhoop(e); }
  }
  $('whAction').addEventListener('click', () => {
    const t = loadJSON(WHOOP_KEY, null);
    if (!t || !t.access) { window.location.href = 'health.html'; return; }
    $('whAction').textContent = 'Syncing…'; syncWhoop();
  });
})();
</script>

<!-- ===== Tile insights — a quick read of each page's live localStorage
     state, since everything here shares one origin. Best-effort: any
     page that hasn't been opened yet just falls back to its default
     copy rather than showing an error. ===== -->
<script>
(function () {
  'use strict';
  function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ---- Creatine checker — tap to mark today's 5g as taken ----
  (function () {
    const btn = document.getElementById('creatineBtn');
    if (!btn) return;
    const KEY = 'creatine:lastTakenDate';
    function render() {
      const done = localStorage.getItem(KEY) === todayKey();
      btn.classList.toggle('done', done);
      btn.querySelector('span:last-child').textContent = done ? 'Creatine taken' : 'Creatine 5g';
    }
    btn.addEventListener('click', () => {
      const done = localStorage.getItem(KEY) === todayKey();
      try {
        if (done) localStorage.removeItem(KEY);
        else localStorage.setItem(KEY, todayKey());
      } catch (e) {}
      render();
    });
    render();
  })();

  // ---- Day progress (mirrors main.html's day ring) ----
  (function () {
    const WAKE_HOUR = 6, SLEEP_HOUR = 21.5; // 6:00 AM – 9:30 PM
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60;
    const el = document.getElementById('mainStatDay');
    if (!el) return;
    if (hours < WAKE_HOUR) { el.textContent = '😴'; return; }
    if (hours >= SLEEP_HOUR) { el.textContent = '🌙'; return; }
    const percent = (hours - WAKE_HOUR) / (SLEEP_HOUR - WAKE_HOUR) * 100;
    el.textContent = Math.floor(percent) + '%';
  })();

  // ---- Fitness: today's split day, from gym.html's rotation state ----
  (function () {
    const heroEl = document.getElementById('fitnessHeroStat');
    const statEl = document.getElementById('mainStatFitness');
    const s = readJSON('po_coach_v1');
    if (!s || !Array.isArray(s.splitRotation) || !s.splitRotation.length || !s.splitAnchor) return;
    try {
      const rot = s.splitRotation;
      const a = new Date(s.splitAnchor.date);
      const t = new Date();
      a.setHours(0,0,0,0); t.setHours(0,0,0,0);
      const diffDays = Math.round((t - a) / 86400000);
      const idx = ((s.splitAnchor.index + diffDays) % rot.length + rot.length) % rot.length;
      if (heroEl) heroEl.textContent = rot[idx];
      if (statEl) statEl.textContent = rot[idx];
    } catch (e) {}
  })();

  // ---- Golf: rough handicap index, same calc as golf.html ----
  (function () {
    const heroEl = document.getElementById('golfHeroStat');
    const statEl = document.getElementById('mainStatGolf');
    const rounds = readJSON('golf:rounds');
    if (!Array.isArray(rounds) || !rounds.length) { if (heroEl) heroEl.textContent = 'No rounds yet'; return; }
    const comparable = rounds
      .slice()
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.ts || 0) - (a.ts || 0))
      .slice(0, 20)
      .map(r => typeof r.differential === 'number' ? (r.holes === 9 ? r.differential * 2 : r.differential) : null)
      .filter(d => typeof d === 'number');
    if (comparable.length < 3) {
      if (heroEl) heroEl.textContent = comparable.length + '/3 rounds';
      if (statEl) statEl.textContent = comparable.length + '/3';
      return;
    }
    const best = comparable.slice().sort((a, b) => a - b).slice(0, Math.min(8, comparable.length));
    const avg = Math.round((best.reduce((a, b) => a + b, 0) / best.length) * 10) / 10;
    if (heroEl) heroEl.textContent = '~' + avg;
    if (statEl) statEl.textContent = '~' + avg;
  })();

  // ---- Net worth: total + per-holding breakdown, for both the Finance
  // tile's one-liner and Main's pie chart. Each individual holding gets
  // its own pie slice (not just one slice per category) — colour is
  // whatever was customized on the Finance page (item.color), or a
  // stable default derived from the same name/ticker hash finance.html
  // uses, so an uncoloured item's default matches on both pages. ----
  (function () {
    const finEl = document.getElementById('tileInsightFinance');
    const pieEl = document.getElementById('mainNwPie');
    const totalEl = document.getElementById('mainNwTotal');
    const legendEl = document.getElementById('mainNwLegend');
    const CAT_KEYS = ['bank', 'stocks', 'crypto', 'other'];
    const PALETTE = ['#7DD3FC','#6EE7B7','#C9B8FF','#F2C063','#FF8A8A','#F472B6','#FCD34D','#34D399','#A78BFA','#60A5FA','#FB923C','#4ADE80'];
    function defaultColor(catKey, it) {
      const seed = catKey + ':' + (it.ticker || it.name || '');
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
      return PALETTE[hash % PALETTE.length];
    }

    let total = 0;
    const slices = [];
    CAT_KEYS.forEach(catKey => {
      const items = readJSON('nw:' + catKey);
      if (!Array.isArray(items)) return;
      items.forEach(it => {
        const amt = Number(it.amount) || 0;
        if (amt <= 0) return;
        total += amt;
        slices.push({ name: it.name || catKey, color: it.color || defaultColor(catKey, it), amount: amt });
      });
    });
    if (total <= 0) return;

    // Display currency: whatever's set on the Finance page (defaults to
    // AUD), converted from the CHF-base amounts via the same exchange
    // rates the Finance page fetched (cached to fx:rates for us).
    const ccy = readJSON('nw_currency') || 'AUD';
    const rates = readJSON('fx:rates') || { CHF: 1, USD: 1, EUR: 1, GBP: 1, AUD: 1 };
    const rate = rates[ccy] || 1;
    const displayTotal = total * rate;
    const totalStr = ccy + ' ' + Math.round(displayTotal).toLocaleString('en-US');

    if (finEl) finEl.textContent = 'Net worth: ' + totalStr;
    if (totalEl) totalEl.textContent = totalStr;

    slices.sort((a, b) => b.amount - a.amount);

    if (pieEl) {
      let acc = 0;
      const stops = slices.map(s => {
        const from = (acc / total) * 100;
        acc += s.amount;
        const to = (acc / total) * 100;
        return s.color + ' ' + from.toFixed(2) + '% ' + to.toFixed(2) + '%';
      });
      if (stops.length) pieEl.style.background = 'conic-gradient(' + stops.join(', ') + ')';
    }
    if (legendEl) {
      // Cap the legend so a long holdings list doesn't blow out the tile —
      // the pie itself still reflects every slice.
      const shown = slices.slice(0, 6);
      const rest = slices.length - shown.length;
      legendEl.innerHTML = shown.map(s => {
        const pct = Math.round((s.amount / total) * 100);
        return '<div class="main-nw-legend-row">' +
          '<span class="main-nw-legend-dot" style="background:' + s.color + '"></span>' +
          '<span>' + s.name + ' ' + pct + '%</span>' +
        '</div>';
      }).join('') + (rest > 0 ? '<div class="main-nw-legend-row"><span>+' + rest + ' more</span></div>' : '');
    }
  })();

  // ---- Stocks: snapshot from whatever the Finance page last fetched
  // (stocks:snapshot, written by FROK-finance-standalone.html whenever
  // it refreshes live prices). Shows up to 3 tickers, on the Main tile. ----
  (function () {
    const wrap = document.getElementById('stockSnapshot');
    const empty = document.getElementById('mainStockEmpty');
    if (!wrap) return;
    const snap = readJSON('stocks:snapshot');
    const rows = (snap && typeof snap === 'object') ? Object.entries(snap).slice(0, 3) : [];
    if (!rows.length) { if (empty) empty.hidden = false; return; }
    wrap.innerHTML = rows.map(([ticker, q]) => {
      const up = (q.changePercent || 0) >= 0;
      const price = (typeof q.price === 'number') ? q.price.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '—';
      const chg = (typeof q.changePercent === 'number') ? (up ? '+' : '') + q.changePercent.toFixed(2) + '%' : '—';
      return '<div class="stock-snapshot-row">' +
        '<span class="stock-snapshot-ticker">' + ticker + '</span>' +
        '<span class="stock-snapshot-price">' + (q.currency || '') + ' ' + price + '</span>' +
        '<span class="stock-snapshot-chg ' + (up ? 'up' : 'down') + '">' + chg + '</span>' +
      '</div>';
    }).join('');
    wrap.removeAttribute('hidden');
    if (empty) empty.hidden = true;
  })();
})();
</script>

<!-- ===== Vitality backdrop — particle spawner (same as Finance) ===== -->
<script id="vty-backdrop-js">
(function () {
  function spawnParticles() {
    var root = document.getElementById('vty-particles');
    if (!root) return;
    root.innerHTML = '';
    var N = window.innerWidth < 640 ? 10 : 18;
    for (var i = 0; i < N; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (60 + Math.random() * 40) + '%';
      var size = 1.2 + Math.random() * 1.2;
      s.style.width = s.style.height = size + 'px';
      var dur = 22 + Math.random() * 28;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px');
      s.style.setProperty('--dy', -(60 + Math.random() * 50) + 'vh');
      root.appendChild(s);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', spawnParticles);
  } else {
    spawnParticles();
  }
})();
</script>
